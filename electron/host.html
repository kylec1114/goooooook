<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>goooooook Host</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f13;color:#fff;font:16px system-ui}
main{width:min(680px,92vw);padding:32px;border:1px solid #2a2a35;border-radius:16px;background:#15151d}
h1{margin:0 0 8px;font-size:28px}p{color:#b8b8c7;line-height:1.6}#status{font-weight:700;color:#7ee787}code{display:block;margin:16px 0;padding:12px;background:#0b0b10;border-radius:8px;color:#9ecbff;word-break:break-all}button{margin:8px 8px 0 0;padding:12px 18px;border:0;border-radius:8px;background:#2f81f7;color:#fff;font:inherit;cursor:pointer}button.secondary{background:#30363d}
</style>
</head>
<body><main>
<h1>goooooook Host</h1>
<p id="status">正在啟動…</p>
<p>Excel 歌庫、LRC 歌詞、房間資料同隊列狀態會儲存喺應用程式嘅 userData 資料夾。</p>
<code id="url"></code>
<button id="open">開啟遙控頁</button>
<button id="folder" class="secondary">開啟資料夾</button>
<button id="quit" class="secondary">離開</button>
</main><script>
const el=id=>document.getElementById(id);
function render(s){el('status').textContent=s.message;el('status').style.color=s.state==='running'?'#7ee787':s.state==='error'?'#ff7b72':'#d29922';el('url').textContent=s.url;}
window.goooooookHost.onStatus(render);
window.goooooookHost.getStatus().then(render);
el('open').onclick=()=>window.goooooookHost.openController();
el('folder').onclick=()=>window.goooooookHost.openDataFolder();
el('quit').onclick=()=>window.goooooookHost.quit();
</script></body></html>

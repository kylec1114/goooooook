name: Core integration tests
on:
  push:
    branches: [fix/core-auth-playback]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without installer scripts
        run: npm install --ignore-scripts
      - name: Install test-only Socket client
        run: npm install --no-save --ignore-scripts socket.io-client@4.8.1
      - name: Syntax and integration tests
        run: node --test test/core.test.cjs
      - name: Collect audit reports (informational, not a security pass)
        if: always()
        run: |
          node -e "const fs=require('fs'),s=require('child_process').spawnSync; for(const [name,args] of [['all',['audit','--json']],['production',['audit','--omit=dev','--json']]]){const r=s('npm',args,{encoding:'utf8'});fs.writeFileSync('audit-'+name+'.json',r.stdout||JSON.stringify({error:r.error?.message,stderr:r.stderr}));console.log(name+' audit exit status: '+r.status);if(r.status!==0)console.log('Audit requires review; this is not a zero-vulnerability result.');}"
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: audit-*.json
          retention-days: 7

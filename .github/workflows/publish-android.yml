name: Publish public Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android.yml'
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'public/android-release.mjs'
      - 'public/android-download.mjs'
      - 'public/download/**'
      - 'test/android-download.test.mjs'

permissions:
  contents: read

concurrency:
  group: android-public-test
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check public/android-download.mjs && node --check public/settings-library.mjs
      - run: node --test test/android-download.test.mjs

  build-and-publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5

      - name: Restore optional stable debug signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
            echo 'mode=stable debug key supplied by repository secret' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=temporary debug key; in-place updates are not guaranteed' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare and build Android test APK
        run: |
          set -euo pipefail
          (
            if [ ! -d android ]; then npx cap add android; fi
            npx cap sync android
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug --stacktrace --console=plain
          ) 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Verify signed APK and compute checksum
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIGNER=$(find "${ANDROID_HOME:?}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          mkdir -p dist-apk
          cp "$APK" dist-apk/goooooook.apk
          cd dist-apk
          sha256sum goooooook.apk > goooooook.apk.sha256
          sha256sum --check goooooook.apk.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: goooooook-android-test
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          TAG="android-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "Android Debug test build from commit $GITHUB_SHA" "Signing: $SIGNING_MODE" 'Loads the hosted website and requires internet. Not verified on Android TV or physical devices.' 'If signing keys differ, updates may fail. Do not uninstall without confirming local favorites/playlists are backed up.' 'This workflow does not deploy the website or run D1 migrations.' > "$RUNNER_TEMP/android-notes.txt"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Android test $TAG" --draft --prerelease --notes-file "$RUNNER_TEMP/android-notes.txt"
          gh release upload "$TAG" dist-apk/goooooook.apk dist-apk/goooooook.apk.sha256
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '[.assets[] | select(.state=="uploaded" and .size>0) | .name] | (index("goooooook.apk")!=null and index("goooooook.apk.sha256")!=null)' | grep -qx true
          gh release edit "$TAG" --draft=false --prerelease
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-build-diagnostics
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

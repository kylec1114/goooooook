name: D1 Setup and Deploy Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/d1-setup-deploy.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Integrate safe music search and room tools; deploy reviewed build')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Cloudflare secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install Worker dependencies without lifecycle scripts
        run: npm install --prefix cloud --ignore-scripts --no-audit --no-fund
      - name: Install Wrangler 4
        run: |
          npm install --prefix "$RUNNER_TEMP/cloudflare-cli" --no-audit --no-fund wrangler@4
          echo "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Syntax and existing permission tests
        run: |
          set -euo pipefail
          for file in cloud/*.mjs public/*.mjs extension/*.js; do node --check "$file"; done
          node cloud/permissions.test.mjs
          node --test test/frontend-sync.test.cjs test/room-protocol.test.mjs test/room-worker.test.mjs test/music-features.test.mjs
          node cloud/music-install.test.mjs
      - name: Initialize original tables
        run: wrangler d1 execute goooooook --remote --file=schema.sql --yes
      - name: Add room expiry, permissions and telemetry tables
        run: wrangler d1 execute goooooook --remote --file=cloud/migration.sql --yes
      - name: Validate Worker bundle
        run: wrangler deploy --dry-run
      - name: Deploy with actual GitHub commit
        run: wrangler deploy --var "BUILD_COMMIT:$GITHUB_SHA"

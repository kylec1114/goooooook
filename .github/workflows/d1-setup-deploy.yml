name: D1 Setup and Deploy Web
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Cloudflare secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install isolated Worker dependencies
        run: npm install --prefix cloud --ignore-scripts --no-audit --no-fund
      - name: Install Wrangler 4
        run: |
          npm install --prefix "$RUNNER_TEMP/cloudflare-cli" --no-audit --no-fund wrangler@4
          echo "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check JavaScript syntax
        run: |
          node --check cloud/worker.mjs
          node --check public/remote.js
      - name: Test API permission and expiry checks
        run: node cloud/permissions.test.mjs
      - name: Initialize original tables
        run: wrangler d1 execute goooooook --remote --file=schema.sql --yes
      - name: Add room expiry and permissions tables
        run: wrangler d1 execute goooooook --remote --file=cloud/migration.sql --yes
      - name: Validate Worker bundle
        run: wrangler deploy --dry-run
      - name: Deploy website and minute cleanup trigger
        run: wrangler deploy

name: D1 Setup and Deploy Web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check secrets and required files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          test -f wrangler.toml
          test -f schema.sql
          test -f worker.js
          test -f public/index.html
          if grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo '::error::D1 database ID is still a placeholder'
            exit 1
          fi

      - name: Install isolated Wrangler 4
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cloudflare-cli" --no-audit --no-fund wrangler@4
          echo "$RUNNER_TEMP/cloudflare-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show Wrangler version
        run: wrangler --version

      - name: Initialize D1 tables without deleting data
        run: wrangler d1 execute goooooook --remote --file=schema.sql --yes

      - name: Verify D1 tables
        run: >-
          wrangler d1 execute goooooook --remote
          --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('rooms','sessions','songs','queue') ORDER BY name;"
          --yes

      - name: Deploy Worker and static website
        run: wrangler deploy

name: YouTube player configuration tests
on:
  push:
    branches: [main]
    paths: ['public/room-screen.html', 'test/youtube-controls.test.cjs', '.github/workflows/youtube-controls.yml']
  pull_request:
    paths: ['public/room-screen.html', 'test/youtube-controls.test.cjs', '.github/workflows/youtube-controls.yml']
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test test/youtube-controls.test.cjs test/frontend-sync.test.cjs test/room-autoplay.test.cjs

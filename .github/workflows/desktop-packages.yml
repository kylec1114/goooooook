name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build desktop installer
        run: npx electron-builder --publish never
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: goooooook-windows
          path: dist/*.exe
          retention-days: 14

      - name: Upload macOS installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: goooooook-macos
          path: dist/*.dmg
          retention-days: 14

      - name: Upload Linux installer
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: goooooook-linux
          path: dist/*.AppImage
          retention-days: 14

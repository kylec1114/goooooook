<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>goooooook 分享接收</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f13;color:#eee;font:16px system-ui}main{max-width:520px;padding:28px;text-align:center}a{color:#e91e63}</style>
</head>
<body><main>
<h1>goooooook</h1>
<p id="message">正在處理分享內容…</p>
<p><a href="/">返回遙控頁</a></p>
</main><script>
'use strict';
const params=new URLSearchParams(location.search);
const candidates=[params.get('url'),params.get('text'),params.get('title')].filter(Boolean);
const shared=candidates.map(value=>{const match=String(value).match(/https?:\/\/[^\s"'<>]+/i);return match?match[0]:'';}).find(Boolean);
const message=document.getElementById('message');
if(shared){message.textContent='已取得分享連結，正在開啟遙控頁…';location.replace('/?shared='+encodeURIComponent(shared));}else{message.textContent='分享內容未包含可用網址。請喺 YouTube 撳分享，再揀 goooooook。';}
</script></body></html>

<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>goooooook TV / Remote</title><link rel="stylesheet" href="/karaoke.css"></head><body class="remote"><header class="chrome"><span class="brand">goooooook TV</span><span id="room" class="gold"></span><a class="button" href="/studio.html">點歌</a></header><main><p id="status" class="chrome" role="status" aria-live="polite"></p><form id="login" class="card form chrome"><h2>連接房間</h2><label>7 位房號<input name="code" pattern="[A-Za-z0-9]{7}" maxlength="7" required></label><label>密碼<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">連接遙控</button></form><section id="session" hidden><p id="connection" class="muted chrome"></p><div class="layout"><aside class="card chrome"><img id="poster" alt="" hidden><small class="gold">隊列第一首</small><h2 id="title">等待點歌</h2><p id="singer" class="muted"></p><small id="playState">尚無 TV 實際播放回報</small></aside><div><div class="video"><div id="player"></div></div><div class="card chrome"><div id="owner" class="row" hidden><button data-action="play" class="primary">▶ 播放</button><button data-action="pause">Ⅱ 暫停</button><button data-action="restart">↻ 重唱</button><button data-action="next">下一首 ▷</button></div><div id="tvControls" class="row" hidden><button id="start" class="primary">開始播放</button><button id="next">下一首</button><button id="full">全螢幕</button><button id="clean">純播放</button></div><label id="volumeLabel" hidden>整體音量 <output id="value">100%</output><input id="volume" type="range" min="0" max="100" value="100"></label><small>整體音量，不是獨立人聲音軌。</small><p><button id="tv" hidden>切換為 TV 播放端</button> <button id="leave">退出此頁</button></p></div></div><aside class="card chrome"><h2>即將播放</h2><div id="queue" class="queue"></div></aside></div></section></main><button id="reveal" hidden>顯示控制</button><nav class="tabs chrome"><a class="button" href="/studio.html">首頁／點歌</a><a class="button" href="/studio.html">收藏／音效</a></nav><script>
'use strict';
const $=id=>document.getElementById(id),SK='goooooook.ui-session.v1';let identity=null,tvMode=false,state=null,player=null,ready=false,leader=false,current=null,seen=null,restart=null,timer=null,epoch=0,pollBusy=false,advancing=false,active=false,switching=false;
const params=new URLSearchParams(location.search),source=params.get('token'),room=params.get('room'),wantTV=params.get('mode')==='tv'||!!source;history.replaceState(null,'',location.pathname);
function note(t){$('status').textContent=t;}function guard(fn){return async()=>{try{await fn();}catch(e){note(e.message);}};}function stop(){active=false;epoch++;clearTimeout(timer);leader=false;identity=null;state=null;current=null;seen=null;restart=null;sessionStorage.removeItem(SK);if(player){player.destroy();player=null;}ready=false;tvMode=false;switching=false;document.body.className='remote';$('login').hidden=false;$('session').hidden=true;$('room').textContent='';}
async function api(path,data){const s=identity;if(!s)throw Error('請先登入');const r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{Authorization:'Bearer '+s.roomToken,...(data===undefined?{}:{'Content-Type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data)});const d=await r.json();if(!r.ok){if(identity===s&&[401,410].includes(r.status))stop();throw Error(d.error||'操作失敗');}return d;}
function render(d){state=d;$('room').textContent=d.roomCode;$('connection').textContent=(tvMode?(d.leader?'● 主電視已取得播放權':'等待播放權'):(d.role==='owner'?'房主遙控 · 已讀取房間狀態':'訪客 · 查看隊列'))+' · '+new Date().toLocaleTimeString();$('owner').hidden=tvMode||d.role!=='owner';$('tv').hidden=tvMode||d.role!=='owner';$('volumeLabel').hidden=tvMode||d.role!=='owner';$('tvControls').hidden=!tvMode;if(document.activeElement!==$('volume'))$('volume').value=d.volume;$('value').textContent=d.volume+'%';const s=d.queue[0];$('title').textContent=s?.title||'等待點歌';$('singer').textContent=s?.singer||'';$('poster').hidden=!s;if(s&&/^[\w-]{11}$/.test(s.videoId))$('poster').src='https://i.ytimg.com/vi/'+s.videoId+'/hqdefault.jpg';$('queue').replaceChildren();if(d.queue.length<2)$('queue').textContent='未有下一首';d.queue.slice(1).forEach((s,i)=>{const row=document.createElement('article');row.className='song';if(/^[\w-]{11}$/.test(s.videoId)){const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+s.videoId+'/mqdefault.jpg';img.alt='';row.append(img);}const text=document.createElement('div');text.className='info';text.textContent=(i+1)+'. '+s.title;const sub=document.createElement('small');sub.textContent=s.singer;text.append(sub);row.append(text);$('queue').append(row);});}
function apply(d){render(d);leader=d.leader===true;$('start').disabled=!leader;$('next').disabled=!leader;if(!ready)return;if(!leader){player.pauseVideo();return;}player.setVolume(d.volume);const s=d.queue[0];if(!s){player.stopVideo();current=null;return;}if(current!==s.id){current=s.id;seen=null;player.loadVideoById(s.videoId);}if(restart!==d.restartRevision){if(restart!==null&&d.restartItem===s.id)player.seekTo(0,true);restart=d.restartRevision;}if(d.paused)player.pauseVideo();else if(player.getPlayerState()===2)player.playVideo();}
async function poll(){if(!active||pollBusy)return;pollBusy=true;const e=epoch;try{const d=await api(tvMode?'/api/player/heartbeat':'/api/state',tvMode?{playing:leader&&ready&&player.getPlayerState()===1}:undefined);if(e!==epoch)return;note('');if(tvMode)apply(d);else render(d);}catch(err){if(e===epoch){leader=false;if(ready)player.pauseVideo();note(err.message);}}finally{pollBusy=false;if(active&&e===epoch){clearTimeout(timer);timer=setTimeout(poll,tvMode?3000:2000);}}}
async function youtube(){if(window.YT?.Player)return;await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('YouTube API 載入逾時')),15000);window.onYouTubeIframeAPIReady=()=>{clearTimeout(timeout);resolve();};const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{clearTimeout(timeout);reject(Error('YouTube API 載入失敗'));};document.head.append(script);});}
async function tv(){if(switching||tvMode)return;switching=true;const parent=identity;active=false;clearTimeout(timer);epoch++;try{while(pollBusy)await new Promise(r=>setTimeout(r,20));await youtube();const d=await api('/api/player',{});identity={...d,role:'player'};tvMode=true;document.body.classList.remove('remote');$('owner').hidden=true;$('tv').hidden=true;$('volumeLabel').hidden=true;$('tvControls').hidden=false;player=new YT.Player('player',{playerVars:{origin:location.origin,playsinline:1,cc_load_policy:1,cc_lang_pref:'zh-HK'},events:{onReady:()=>{ready=true;active=true;poll();},onApiChange:()=>{try{player.setOption('captions','fontSize',3);}catch{}},onStateChange:e=>{$('playState').textContent=({'1':'正在播放','2':'已暫停','3':'緩衝中','0':'播放結束'})[e.data]||'等待播放';if(e.data===1){if(!leader){player.pauseVideo();return;}seen=current;}if(e.data===0&&leader&&current&&seen===current){seen=null;next().catch(err=>note(err.message));}},onError:e=>note('YouTube 錯誤 '+e.data+'；可手動下一首'),onAutoplayBlocked:()=>note('請按開始播放以允許音訊')}});}catch(e){if(identity){identity=parent;tvMode=false;document.body.classList.add('remote');active=true;poll();}throw e;}finally{switching=false;}}
async function next(){if(advancing||!leader||!state?.queue[0])return;advancing=true;try{apply(await api('/api/queue/next',{currentItemId:state.queue[0].id}));}finally{advancing=false;}}
async function enter(){if(!identity?.roomCode||!/^[a-f0-9]{64}$/.test(identity.roomToken||''))throw Error('登入資料失效');$('login').hidden=true;$('session').hidden=false;active=true;if(wantTV)await tv();else await poll();}
$('login').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomCode:f.code.value.trim().toUpperCase(),password:f.password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'登入失敗');identity=d;sessionStorage.setItem(SK,JSON.stringify({roomCode:d.roomCode,roomToken:d.roomToken,role:d.role}));f.password.value='';await enter();}catch(err){note(err.message);}finally{b.disabled=false;}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=guard(async()=>{b.disabled=true;try{render(await api('/api/control',{action:b.dataset.action,currentItemId:state?.queue[0]?.id}));note('控制已送出；等待 TV 下一次報到。');}finally{b.disabled=false;}}));$('volume').onchange=guard(async()=>render(await api('/api/control',{action:'volume',value:Number($('volume').value)})));$('volume').oninput=()=>$('value').textContent=$('volume').value+'%';$('tv').onclick=guard(tv);$('start').onclick=()=>{if(leader&&ready){if(state?.paused)note('房間處於暫停，請由房主遙控按播放');else player.playVideo();}};$('next').onclick=guard(next);$('full').onclick=guard(async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();});$('clean').onclick=()=>document.body.classList.add('clean');$('reveal').onclick=()=>document.body.classList.remove('clean');$('leave').onclick=()=>{stop();note('已清除此分頁登入；其他裝置不受影響');};window.addEventListener('pagehide',()=>{active=false;clearTimeout(timer);});window.addEventListener('pageshow',e=>{if(e.persisted&&identity){active=true;poll();}});try{identity=source&&room?{roomCode:room,roomToken:source}:JSON.parse(sessionStorage.getItem(SK)||'null');if(identity)enter().catch(e=>note(e.message));}catch(e){stop();note(e.message);}
</script></body></html>

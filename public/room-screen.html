<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>goooooook · 房間播放</title><style>
*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:radial-gradient(at top,#301026,transparent 60%),#0b0710;color:#fff;font:16px system-ui}header{display:flex;gap:16px;align-items:center;padding:20px 4%;border-bottom:1px solid #392944}.brand{color:#e82a83;font-size:26px;font-weight:900;margin-right:auto}button,input,a{font:inherit}button,.link{border:1px solid #51405d;border-radius:12px;background:#24192e;color:#fff;padding:12px 18px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #ffd49b;outline-offset:3px}.primary{background:linear-gradient(120deg,#e31b75,#b51990);border:0;box-shadow:0 0 26px #d8287033}main{padding:24px 4% 100px;max-width:1500px;margin:auto}.card{background:linear-gradient(130deg,#211829,#14101f);border:1px solid #45334f;border-radius:18px;padding:20px}#login{max-width:480px;margin:30px auto}label{display:block;margin:16px 0}input{width:100%;display:block;margin-top:8px;padding:12px;background:#0e0a16;color:white;border:1px solid #51405d;border-radius:10px}small,.muted{color:#b5a7c1;line-height:1.6}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:18px}.video{aspect-ratio:16/9;background:#000;border:1px solid #613348;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #d8287022}#player,.video iframe{width:100%;height:100%;border:0}#poster{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.title{font-size:22px;overflow-wrap:anywhere}.gold{color:#ffd49b}.queue{max-height:65vh;overflow:auto}.song{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #382a43}.song img{width:64px;height:48px;object-fit:cover;border-radius:8px}.song span{flex:1;overflow-wrap:anywhere}.song small{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.volume{max-width:480px}#status{color:#ffd49b;white-space:pre-wrap}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#100a18f5;padding:12px;border-top:1px solid #45334f}[hidden]{display:none!important}body.remote main{max-width:650px}body.remote .layout{display:flex;flex-direction:column}body.remote .video{display:none}body.remote #poster{width:100px;float:left;margin:0 18px 12px 0}body.remote .queue{max-height:none}.clean header,.clean #status,.clean aside,.clean .toolbar,.clean .volume,.clean .tabs,.clean #sessionInfo{display:none}.clean main{padding:0;max-width:none}.clean .layout{display:block}.clean .video{position:fixed;inset:0;width:100%;height:100%;border:0;border-radius:0;aspect-ratio:auto}.clean #exitClean{display:block;position:fixed;right:12px;top:12px;z-index:9}@media(max-width:900px){.layout{grid-template-columns:1fr}.queue{max-height:none}header{padding:14px;gap:8px}.brand{font-size:21px}header button{padding:10px}.title{font-size:20px}}
</style></head><body class="remote"><header><span class="brand">goooooook TV</span><span id="room" class="gold"></span><a class="link" href="/studio.html">首頁</a></header><main><p id="status" role="status" aria-live="polite"></p><form id="login" class="card"><h2>連接 KTV 房間</h2><label>7 位房間代碼<input name="code" pattern="[A-Za-z0-9]{7}" maxlength="7" required></label><label>房間密碼<input name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="72"></label><button class="primary">連接手機遙控</button><p class="muted">房主登入後可開啟 TV 模式；訪客可查看隊列。憑證只留在此頁記憶體。</p></form><section id="session" hidden><p id="sessionInfo" class="muted"></p><div class="layout"><aside class="card"><img id="poster" alt="" hidden><small class="gold">隊列第一首</small><h2 id="title" class="title">等待點歌</h2><p id="singer" class="muted"></p><small id="playState">尚未取得 TV 播放狀態</small></aside><div><div class="video"><div id="player"></div></div><div class="toolbar" id="ownerControls" hidden><button data-action="play" aria-label="播放">▶ 播放</button><button data-action="pause">Ⅱ 暫停</button><button data-action="restart">↻ 重唱</button><button data-action="next">下一首 ▷</button></div><div class="toolbar" id="tvControls" hidden><button id="start" class="primary">開始播放</button><button id="skip">下一首</button><button id="full">全螢幕</button><button id="clean">純播放畫面</button></div><label class="volume" id="volumeLabel" hidden>整體播放音量 <output id="volumeValue">100%</output><input id="volume" type="range" min="0" max="100" value="100"></label><small>整體音量會同時改變人聲及伴奏；不是獨立人聲音軌控制。</small><div class="toolbar"><button id="openTV" class="primary" hidden>此頁切換為 TV 播放端</button><button id="refresh">更新狀態</button><button id="leave">退出此頁</button></div></div><aside class="card"><h2>即將播放</h2><div id="queue" class="queue"></div></aside></div></section></main><button id="exitClean" hidden>顯示控制</button><nav class="tabs"><a class="link" href="/studio.html">點歌／收藏</a><button id="queueFocus">播放清單</button></nav><script>
'use strict';
const $=id=>document.getElementById(id);let identity=null,mode='remote',state=null,player=null,ready=false,leader=false,current=null,seen=null,restart=null,timer=null,running=false,epoch=0,pollBusy=false;const params=new URLSearchParams(location.search),initialToken=params.get('token'),initialRoom=params.get('room');history.replaceState(null,'',location.pathname);
function note(t){$('status').textContent=t;}function guard(fn){return async()=>{try{await fn();}catch(e){note(e.message);}};}
async function api(path,data,method){const active=identity;if(!active)throw Error('請先連接房間');const r=await fetch(path,{method:method||(data===undefined?'GET':'POST'),headers:{Authorization:'Bearer '+active.roomToken,...(data===undefined?{}:{'Content-Type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data)});let d;try{d=await r.json();}catch{throw Error('伺服器未回傳 JSON');}if(!r.ok){if(active===identity&&[401,410].includes(r.status))stop();throw Error(d.error||'操作失敗');}return d;}
function render(d){state=d;$('room').textContent=d.roomCode;$('sessionInfo').textContent=(mode==='tv'?(d.leader?'主電視已取得播放權':'等待主電視播放權'):(d.role==='owner'?'房主遙控':'訪客：查看隊列'))+' · 狀態讀取 '+new Date().toLocaleTimeString();const s=d.queue[0];$('title').textContent=s?.title||'等待點歌';$('singer').textContent=s?.singer||'';$('poster').hidden=!s;if(s&&/^[\w-]{11}$/.test(s.videoId))$('poster').src='https://i.ytimg.com/vi/'+s.videoId+'/hqdefault.jpg';$('volume').value=d.volume;$('volumeValue').textContent=d.volume+'%';$('ownerControls').hidden=mode!=='remote'||d.role!=='owner';$('volumeLabel').hidden=mode!=='remote'||d.role!=='owner';$('openTV').hidden=mode!=='remote'||d.role!=='owner';$('queue').replaceChildren();if(d.queue.length<2)$('queue').textContent='未有下一首，快啲點歌！';d.queue.slice(1).forEach((s,i)=>{const row=document.createElement('div');row.className='song';const n=document.createElement('span');n.textContent=(i+1)+'. '+s.title;const meta=document.createElement('small');meta.textContent=s.singer;n.append(meta);row.append(n);$('queue').append(row);});}
function apply(d){render(d);leader=d.leader===true;$('start').disabled=!leader;$('skip').disabled=!leader;if(!ready)return;if(!leader){player.pauseVideo();return;}player.setVolume(d.volume);const song=d.queue[0];if(!song){player.stopVideo();current=null;return;}if(current!==song.id){current=song.id;seen=null;player.loadVideoById(song.videoId);}if(restart!==d.restartRevision){if(restart!==null&&d.restartItem===song.id)player.seekTo(0,true);restart=d.restartRevision;}if(d.paused)player.pauseVideo();else if(player.getPlayerState()===2)player.playVideo();}
async function poll(){if(!running||pollBusy)return;pollBusy=true;const version=epoch;try{const d=await api(mode==='tv'?'/api/player/heartbeat':'/api/state',mode==='tv'?{playing:leader&&ready&&player.getPlayerState()===1}:undefined);if(version!==epoch)return;note('');if(mode==='tv')apply(d);else render(d);}catch(e){if(version===epoch){leader=false;if(ready)player.pauseVideo();note(e.message);}}finally{pollBusy=false;if(running&&version===epoch)timer=setTimeout(poll,mode==='tv'?3000:2000);}}
function stop(){running=false;epoch++;clearTimeout(timer);leader=false;identity=null;state=null;current=null;seen=null;restart=null;if(player){player.destroy();player=null;}ready=false;mode='remote';document.body.className='remote';$('session').hidden=true;$('login').hidden=false;$('room').textContent='';$('tvControls').hidden=true;}
async function tv(){running=false;clearTimeout(timer);epoch++;while(pollBusy)await new Promise(r=>setTimeout(r,20));const d=await api('/api/player',{});identity={...d,role:'player'};mode='tv';document.body.classList.remove('remote');$('tvControls').hidden=false;$('ownerControls').hidden=true;$('volumeLabel').hidden=true;$('openTV').hidden=true;note('正在載入 YouTube 播放器…');await new Promise((resolve,reject)=>{if(window.YT?.Player)return resolve();window.onYouTubeIframeAPIReady=resolve;const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>reject(Error('YouTube API 載入失敗'));document.head.append(script);});player=new YT.Player('player',{playerVars:{origin:location.origin,playsinline:1,cc_load_policy:1,cc_lang_pref:'zh-HK'},events:{onReady:()=>{ready=true;running=true;poll();},onApiChange:()=>{try{player.setOption('captions','fontSize',3);}catch{}},onStateChange:e=>{const names={'1':'正在播放','2':'已暫停','3':'緩衝中','0':'播放結束'};$('playState').textContent=names[e.data]||'等待播放';if(e.data===1){if(!leader){player.pauseVideo();return;}seen=current;}if(e.data===0&&leader&&current&&seen===current){seen=null;next().catch(err=>note(err.message));}},onError:e=>note('YouTube 錯誤 '+e.data+'，可手動下一首'),onAutoplayBlocked:()=>note('瀏覽器阻擋自動播放，請按開始播放')}});}
async function next(){if(!leader||!state?.queue[0])return;apply(await api('/api/queue/next',{currentItemId:state.queue[0].id}));}
$('login').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomCode:f.elements.code.value.trim().toUpperCase(),password:f.elements.password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'登入失敗');identity=d;f.elements.password.value='';$('login').hidden=true;$('session').hidden=false;running=true;await poll();}catch(err){note(err.message);}finally{b.disabled=false;}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=guard(async()=>{b.disabled=true;try{render(await api('/api/control',{action:b.dataset.action,currentItemId:state?.queue[0]?.id}));}finally{b.disabled=false;}}));$('volume').onchange=guard(async()=>render(await api('/api/control',{action:'volume',value:Number($('volume').value)})));$('volume').oninput=()=>$('volumeValue').textContent=$('volume').value+'%';$('openTV').onclick=guard(tv);$('refresh').onclick=guard(poll);$('skip').onclick=guard(next);$('start').onclick=()=>{if(leader&&ready)player.playVideo();};$('full').onclick=guard(async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();});$('clean').onclick=()=>document.body.classList.add('clean');$('exitClean').onclick=()=>document.body.classList.remove('clean');$('queueFocus').onclick=()=>$('queue').scrollIntoView({behavior:'smooth'});$('leave').onclick=()=>{stop();note('已退出此頁；未撤銷其他裝置登入。');};window.addEventListener('pagehide',()=>{running=false;clearTimeout(timer);});if(initialRoom)$('login').elements.code.value=initialRoom;if(initialToken&&initialRoom){identity={roomCode:initialRoom,roomToken:initialToken};$('login').hidden=true;$('session').hidden=false;tv().catch(e=>{stop();note(e.message);});}
</script></body></html>

<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>goooooook TV</title><style>body{margin:0;background:#000;color:#fff;font:20px system-ui}#stage{height:70vh}#stage iframe{width:100%;height:100%}#lyrics{min-height:2em;text-align:center;font-size:32px;padding:12px}#panel{padding:16px}button{padding:14px;margin:8px;font:inherit}#list{white-space:pre-wrap}:fullscreen #stage{height:75vh}</style></head>
<body><div id="stage"><div id="player"></div></div><div id="lyrics"></div><div id="panel"><div id="now">正在驗證電視…</div><p id="status" role="status"></p><button id="start">開始／繼續播放</button><button id="skip">跳過</button><button id="fullscreen">全螢幕</button><div id="list"></div></div><script src="/socket.io/socket.io.js"></script><script>
'use strict';
const el=id=>document.getElementById(id);let player,ready=false,current=null,loadedId=null,lyrics=[],generation=0,socket,token,roomCode,leader=false,seenPlaying=null;
const params=new URLSearchParams(location.search);const sourceToken=params.get('token');const sourceRoom=params.get('room');history.replaceState(null,'',location.pathname);let apiLoadedResolve;const apiLoaded=new Promise(r=>apiLoadedResolve=r);window.onYouTubeIframeAPIReady=()=>apiLoadedResolve();
function note(t){el('status').textContent=t;}
async function request(url,body,credential=token){const r=await fetch(url,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+credential,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'請求失敗');return d;}
function sync(){if(!ready||!leader)return;if(!current){player.stopVideo();loadedId=null;seenPlaying=null;return;}if(loadedId!==current.id){loadedId=current.id;seenPlaying=null;player.loadVideoById(current.videoId);}}
async function claim(){socket.emit('claimPlayer',{},r=>{leader=!!r?.leader;el('skip').disabled=!leader;el('start').disabled=!leader;if(!leader){if(ready)player.pauseVideo();note('另一個電視頁是主播放端；關閉它後可在此接管。');}else sync();});}
async function update(q){const next=q[0]||null;const changed=next?.id!==current?.id;current=next;el('now').textContent=current?'而家唱：'+current.title+' — '+current.singer:'等待第一首歌';el('list').textContent=q.slice(1).map((s,i)=>(i+1)+'. '+s.title+' — '+s.singer).join('\n');if(changed){const g=++generation;lyrics=[];el('lyrics').textContent='';sync();if(current)try{const d=await request('/api/lyrics/'+current.videoId);if(g===generation)lyrics=d.lyrics||[];}catch(e){if(g===generation)note(e.message);}}else sync();}
function advance(event){if(!current||!leader)return;socket.emit(event,{currentItemId:current.id},r=>{if(!r?.ok)note('此播放端未獲授權或歌曲已切換');});}
el('skip').onclick=()=>advance('skipSong');el('start').onclick=()=>{if(ready&&leader){sync();player.playVideo();}};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else note('此瀏覽器不支援全螢幕');}catch(e){note(e.message);}}
el('fullscreen').onclick=fullscreen;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!e.repeat)fullscreen();});
(async()=>{try{if(!sourceToken||!sourceRoom)throw Error('請由遙控頁取得新的電視連結');const d=await request('/api/player',{},sourceToken);if(d.roomCode!==sourceRoom)throw Error('房間不符');token=d.roomToken;roomCode=d.roomCode;socket=io({auth:{roomCode,roomToken:token}});socket.on('connect',claim);socket.on('queueUpdated',update);socket.on('connect_error',()=>note('電視憑證已失效，請由遙控頁重新開啟'));socket.on('disconnect',()=>{leader=false;if(ready)player.pauseVideo();note('電視連線中斷');});await apiLoaded;player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{origin:location.origin,playsinline:1},events:{onReady:()=>{ready=true;sync();},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING&&current)seenPlaying=loadedId;if(e.data===YT.PlayerState.ENDED&&current&&seenPlaying===current.id&&loadedId===current.id){seenPlaying=null;advance('nextSong');}},onError:e=>note('YouTube 播放失敗：'+e.data+'；可手動跳過'),onAutoplayBlocked:()=>note('請按開始／繼續播放')}});setInterval(()=>{if(socket.connected)claim();},5000);}catch(e){note(e.message);}})();
setInterval(()=>{if(!ready||!current||loadedId!==current.id)return;const time=player.getCurrentTime();let text='';for(const l of lyrics){if(l.time>time)break;text=l.text;}el('lyrics').textContent=text;},150);
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>

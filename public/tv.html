<!doctype html><html lang=\"zh-HK\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"referrer\" content=\"strict-origin-when-cross-origin\"><title>goooooook TV</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:18px system-ui}#stage{position:fixed;inset:0}#player,#stage iframe{width:100%;height:100%;border:0}#panel{position:fixed;bottom:0;left:0;right:0;padding:18px;background:linear-gradient(transparent,#000e);z-index:2}body.clean #panel{display:none}button{font:inherit;padding:12px;margin:5px;background:#222;color:#fff;border:1px solid #888;border-radius:10px}#reveal{position:fixed;right:8px;top:8px;z-index:3}#list{max-height:15vh;overflow:auto;white-space:pre-wrap}#status{color:#ffd29b}#lyrics{position:fixed;left:0;right:0;bottom:18vh;z-index:2;text-align:center;padding:0 5vw;pointer-events:none}#previousLine,#nextLine{margin:8px 0;color:#ffffffa8;font-size:clamp(18px,2.2vw,30px);font-weight:700;text-shadow:0 3px 14px #000}#currentLine{margin:10px 0;color:#fff;font-size:clamp(30px,4.4vw,62px);font-weight:900;text-shadow:0 5px 22px #000}#audioBadge{position:fixed;left:20px;top:20px;z-index:3;padding:8px 14px;border-radius:999px;background:#d82870e6;font-weight:800}#lyricControls{position:fixed;right:20px;top:20px;z-index:3}</style></head><body><div id=\"stage\"><div id=\"player\"></div></div><span id=\"audioBadge\">原聲</span><div id=\"lyricControls\"><button id=\"prevLine\">上一句</button><button id=\"nextLine\">下一句</button></div><button id=\"reveal\">控制</button><div id=\"lyrics\"><p id=\"previousLine\"></p><p id=\"currentLine\">貼上歌詞或 LRC 後顯示字幕</p><p id=\"nextLine\"></p></div><div id=\"panel\"><div id=\"room\"></div><div id=\"now\">正在連線</div><p id=\"status\" role=\"status\"></p><button id=\"start\">開始／繼續</button><button id=\"skip\">下一首</button><button id=\"fullscreen\">全螢幕</button><div id=\"list\"></div></div><script>\n'use strict';\nconst el=id=>document.getElementById(id),params=new URLSearchParams(location.search),source=params.get('token'),room=params.get('room');history.replaceState(null,'',location.pathname);\nlet token=source,player,ready=false,leader=false,current=null,loaded=null,seen=null,stopped=false,busy=false,restart=-1,hideTimer,lines=[],lineIndex=-1;\nlet resolveYT;const ytReady=new Promise(r=>resolveYT=r);window.onYouTubeIframeAPIReady=()=>resolveYT();\nfunction show(){document.body.classList.remove('clean');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(leader&&ready&&player.getPlayerState()===1)document.body.classList.add('clean');},5000);}\nfunction note(t){el('status').textContent=t;show();}\nfunction parseLyrics(text){if(!text)return[];const timed=[];for(const raw of text.split(/\\r?\\n/)){const match=raw.match(/^\\[(\\d+):(\\d+(?:\\.\\d+)?)\\](.*)$/);if(match)timed.push({time:Number(match[1])*60+Number(match[2]),text:match[3].trim()});}if(timed.length)return timed;return text.split(/\\r?\\n/).map((text,i)=>({time:i,text}));}\nfunction renderLine(){const line=lines[lineIndex]||{text:''},next=lines[lineIndex+1]||{text:''},previous=lines[lineIndex-1]||{text:''};el('currentLine').textContent=line.text||'暫時未有歌詞';el('nextLine').textContent=next.text;el('previousLine').textContent=previous.text;}\nfunction setLyrics(text){lines=parseLyrics(text);lineIndex=lines.length?0:-1;renderLine();}\nel('prevLine').onclick=()=>{if(lines.length){lineIndex=Math.max(0,lineIndex-1);renderLine();show();}};el('nextLine').onclick=()=>{if(lines.length){lineIndex=Math.min(lines.length-1,lineIndex+1);renderLine();show();}};\nasync function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401||r.status===410){stopped=true;leader=false;if(ready)player.stopVideo();}throw Error(d.error||'連線失敗');}return d;}\nfunction apply(d){leader=d.leader;el('start').disabled=!leader;el('skip').disabled=!leader;if(!leader){if(ready)player.pauseVideo();note('另一部電視是主播放端；關閉後約20秒可接管。');return;}if(el('status').textContent.startsWith('另一部'))el('status').textContent='';current=d.queue[0]||null;el('room').textContent='房間 '+room;el('now').textContent=current?current.title+' — '+current.singer:'等待點歌';el('audioBadge').textContent=current&&current.audioMode==='karaoke'?'伴奏':'原聲';el('list').textContent=d.queue.slice(1).map((s,i)=>(i+1)+'. '+s.title+' — '+s.singer).join('\\n');if(!ready)return;player.setVolume(d.volume);if(!current){if(loaded)player.stopVideo();loaded=null;setLyrics('');return;}if(loaded!==current.id){loaded=current.id;seen=null;setLyrics(current.lyrics||'');player.loadVideoById(current.videoId);}if(restart!==d.restartRevision){if(restart>=0&&d.restartItem===current.id)player.seekTo(0,true);restart=d.restartRevision;}if(d.paused){if(player.getPlayerState()!==2)player.pauseVideo();}else if(player.getPlayerState()===2)player.playVideo();}\nasync function heartbeat(){if(stopped)return;try{apply(await api('/api/player/heartbeat',{playing:leader&&ready&&player.getPlayerState()===1}));}catch(e){leader=false;if(ready)player.pauseVideo();note(e.message);}finally{if(!stopped)setTimeout(heartbeat,5000);}}\nasync function next(){if(!leader||!current||busy)return;busy=true;try{await api('/api/queue/next',{currentItemId:current.id});apply(await api('/api/player/heartbeat',{playing:false}));}catch(e){note(e.message);}finally{busy=false;}}\nel('skip').onclick=next;el('start').onclick=()=>{if(leader&&ready){player.playVideo();show();}};\nel('reveal').onclick=()=>{if(document.body.classList.contains('clean'))show();else document.body.classList.add('clean');};\nel('fullscreen').onclick=async()=>{try{const root=document.documentElement;if(document.fullscreenElement)await document.exitFullscreen();else if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else note('此瀏覽器不支援真正全屏，播放器已填滿視窗');}catch(e){note(e.message);}show();};document.addEventListener('mousemove',show);document.addEventListener('keydown',e=>{show();if(e.key.toLowerCase()==='f'&&!e.repeat)el('fullscreen').click();});\n(async()=>{try{if(!source||!room)throw Error('請由房主手機取得電視連結');const d=await api('/api/player',{});if(d.roomCode!==room)throw Error('房間不符');token=d.roomToken;await ytReady;player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{origin:location.origin,playsinline:1,fs:1},events:{onReady:()=>{ready=true;heartbeat();},onStateChange:e=>{if(e.data===1){if(!leader){player.pauseVideo();return;}seen=loaded;show();}if(e.data===0&&leader&&current&&seen===current.id){seen=null;next();}},onError:e=>note('YouTube 錯誤 '+e.data+'，可手動下一首'),onAutoplayBlocked:()=>note('請按「開始／繼續」播放')}});}catch(e){note(e.message);}})();\n</script><script src=\"https://www.youtube.com/iframe_api\"></script></body></html>\n

<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>goooooook TV</title><style>body{margin:0;background:#000;color:#fff;font:20px system-ui}#stage{height:70vh}#stage iframe{width:100%;height:100%}#lyrics{min-height:2em;text-align:center;font-size:32px;padding:12px}#panel{padding:16px}button{padding:14px;margin:8px;font:inherit}#list{white-space:pre-wrap}:fullscreen #stage{height:75vh}</style></head>
<body><div id="stage"><div id="player"></div></div><div id="lyrics"></div><div id="panel"><div id="now">正在驗證電視…</div><p id="status" role="status"></p><button id="start">開始／繼續播放</button><button id="skip">跳過</button><button id="fullscreen">全螢幕</button><div id="list"></div></div><script>
'use strict';
const el=id=>document.getElementById(id);let player,ready=false,current=null,loadedId=null,queue=[],token,roomCode,seenPlaying=null;
const params=new URLSearchParams(location.search);token=params.get('token');roomCode=params.get('room');history.replaceState(null,'',location.pathname);let apiLoadedResolve;const apiLoaded=new Promise(r=>apiLoadedResolve=r);window.onYouTubeIframeAPIReady=()=>apiLoadedResolve();
function note(t){el('status').textContent=t;}
async function request(url,body){const r=await fetch(url,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'請求失敗');return d;}
function sync(){if(!ready)return;if(!current){player.stopVideo();loadedId=null;seenPlaying=null;return;}if(loadedId!==current.id){loadedId=current.id;seenPlaying=null;player.loadVideoById(current.videoId);}}
function update(q){queue=q;const next=q[0]||null;const changed=next?.id!==current?.id;current=next;el('now').textContent=current?'而家唱：'+current.title+' — '+current.singer:'等待第一首歌';el('list').textContent=q.slice(1).map((s,i)=>(i+1)+'. '+s.title+' — '+s.singer).join('\n');if(changed){el('lyrics').textContent='';sync();}else sync();}
async function advance(){if(!current)return;try{const d=await request('/api/queue/next',{currentItemId:current.id});update(d.queue||[]);}catch(e){note(e.message);}}
el('skip').onclick=advance;el('start').onclick=()=>{if(ready){sync();player.playVideo();}};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else note('此瀏覽器不支援全螢幕');}catch(e){note(e.message);}}
el('fullscreen').onclick=fullscreen;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!e.repeat)fullscreen();});
(async()=>{try{if(!token||!roomCode)throw Error('請由遙控頁取得新的電視連結');const d=await request('/api/player',{},token);if(d.roomCode!==roomCode)throw Error('房間不符');token=d.roomToken;roomCode=d.roomCode;await apiLoaded;player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{origin:location.origin,playsinline:1},events:{onReady:()=>{ready=true;sync();},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING&&current)seenPlaying=loadedId;if(e.data===YT.PlayerState.ENDED&&current&&seenPlaying===current.id&&loadedId===current.id){seenPlaying=null;advance();}},onError:e=>note('YouTube 播放失敗：'+e.data+'；可手動跳過'),onAutoplayBlocked:()=>note('請按開始／繼續播放')}});setInterval(async()=>{try{const d=await request('/api/queue');update(d.queue||[]);}catch(e){note('連線中斷，正在重試');}},3000);}catch(e){note(e.message);}})();
setInterval(()=>{if(!ready||!current||loadedId!==current.id)return;const time=player.getCurrentTime();el('lyrics').textContent='';},1000);
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>

<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>goooooook TV</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:18px system-ui}#stage{position:fixed;inset:0}#player,#stage iframe{width:100%;height:100%;border:0}#panel{position:fixed;bottom:0;left:0;right:0;padding:18px;background:linear-gradient(transparent,#000e);z-index:2}body.clean #panel,body.clean #lyricControls{display:none}button{font:inherit;padding:12px;margin:5px;background:#222;color:#fff;border:1px solid #888;border-radius:10px}#reveal{position:fixed;right:8px;top:8px;z-index:3}#list{max-height:15vh;overflow:auto;white-space:pre-wrap}#status{color:#ffd29b}#lyrics{position:fixed;left:0;right:0;bottom:18vh;z-index:2;text-align:center;padding:0 5vw;pointer-events:none}#previousLine,#nextLine{margin:8px 0;color:#ffffffa8;font-size:clamp(18px,2.2vw,30px);text-shadow:0 3px 14px #000}#currentLine{margin:10px 0;font-size:clamp(30px,4.4vw,62px);font-weight:900;text-shadow:0 5px 22px #000}#lyricControls{position:fixed;left:20px;top:20px;z-index:3}#lyricInput{width:min(80vw,600px);height:100px}small{display:block;font-size:13px;color:#ddd}#attenuation{width:220px}</style></head><body>
<div id="stage"><div id="player"></div></div><div id="lyricControls"><button id="prevLyric">上一句</button><button id="nextLyric">下一句</button><details><summary>本電視歌詞</summary><textarea id="lyricInput" aria-label="本電視歌詞或 LRC" placeholder="貼上歌詞／LRC；未接通手機跨裝置傳送"></textarea><button id="applyLyrics">套用歌詞</button></details></div><button id="reveal">控制</button><div id="lyrics" hidden><p id="previousLine"></p><p id="currentLine"></p><p id="nextLine"></p></div><div id="panel"><div id="room"></div><div id="now">正在連線</div><p id="status" role="status"></p><button id="start">開始／繼續</button><button id="skip">下一首</button><button id="fullscreen">全螢幕</button><label for="attenuation">整體音量減弱 <output id="attenuationValue">0%</output></label><input id="attenuation" type="range" min="0" max="100" value="0"><small>同時降低人聲及伴奏，並非人聲分離。YouTube CC 預設要求開啟；有字幕嘅影片可用播放器 CC 切換，並不會匯入上方歌詞。</small><div id="list"></div></div>
<script>
'use strict';
const el=id=>document.getElementById(id),params=new URLSearchParams(location.search),source=params.get('token'),room=params.get('room');history.replaceState(null,'',location.pathname);
let token=source,player,ready=false,leader=false,current=null,loaded=null,seen=null,stopped=false,busy=false,restart=-1,hideTimer,lines=[],lineIndex=-1,baseVolume=100;
let resolveYT;const ytReady=new Promise(r=>resolveYT=r);window.onYouTubeIframeAPIReady=()=>resolveYT();
function show(){document.body.classList.remove('clean');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(leader&&ready&&player.getPlayerState()===1)document.body.classList.add('clean');},5000);}
function note(t){el('status').textContent=t;show();}
function applyVolume(){if(ready&&leader)player.setVolume(Math.round(baseVolume*(1-Number(el('attenuation').value)/100)));}
el('attenuation').oninput=()=>{el('attenuationValue').textContent=el('attenuation').value+'%';applyVolume();show();};
function parseLyrics(text){const timed=[];for(const raw of text.split(/\r?\n/)){const match=raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);if(match)timed.push({time:Number(match[1])*60+Number(match[2]),text:match[3].trim()});}if(timed.length)return timed;return text.split(/\r?\n/).filter(s=>s.trim()).map(text=>({text}));}
function renderLine(){el('lyrics').hidden=!lines.length;el('currentLine').textContent=lines[lineIndex]?.text||'';el('nextLine').textContent=lines[lineIndex+1]?.text||'';el('previousLine').textContent=lines[lineIndex-1]?.text||'';}
function setLyrics(text){lines=parseLyrics(text);lineIndex=lines.length?0:-1;renderLine();}
el('prevLyric').onclick=()=>{if(lines.length){lineIndex=Math.max(0,lineIndex-1);renderLine();}};el('nextLyric').onclick=()=>{if(lines.length){lineIndex=Math.min(lines.length-1,lineIndex+1);renderLine();}};el('applyLyrics').onclick=()=>setLyrics(el('lyricInput').value);
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401||r.status===410){stopped=true;leader=false;if(ready)player.stopVideo();}throw Error(d.error||'連線失敗');}return d;}
function apply(d){leader=d.leader;el('start').disabled=!leader;el('skip').disabled=!leader;el('attenuation').disabled=!leader;if(!leader){if(ready)player.pauseVideo();note('另一部電視是主播放端；關閉後約20秒可接管。');return;}if(el('status').textContent.startsWith('另一部'))el('status').textContent='';current=d.queue[0]||null;el('room').textContent='房間 '+room;el('now').textContent=current?current.title+' — '+current.singer:'等待點歌';el('list').textContent=d.queue.slice(1).map((s,i)=>(i+1)+'. '+s.title+' — '+s.singer).join('\n');if(!ready)return;baseVolume=Number.isFinite(d.volume)?Math.max(0,Math.min(100,d.volume)):100;applyVolume();if(!current){if(loaded)player.stopVideo();loaded=null;setLyrics('');return;}if(loaded!==current.id){loaded=current.id;seen=null;el('lyricInput').value=current.lyrics||'';setLyrics(current.lyrics||'');player.loadVideoById(current.videoId);}if(restart!==d.restartRevision){if(restart>=0&&d.restartItem===current.id)player.seekTo(0,true);restart=d.restartRevision;}if(d.paused){if(player.getPlayerState()!==2)player.pauseVideo();}else if(player.getPlayerState()===2)player.playVideo();}
async function heartbeat(){if(stopped)return;try{apply(await api('/api/player/heartbeat',{playing:leader&&ready&&player.getPlayerState()===1}));}catch(e){leader=false;if(ready)player.pauseVideo();note(e.message);}finally{if(!stopped)setTimeout(heartbeat,5000);}}
async function next(){if(!leader||!current||busy)return;busy=true;try{await api('/api/queue/next',{currentItemId:current.id});apply(await api('/api/player/heartbeat',{playing:false}));}catch(e){note(e.message);}finally{busy=false;}}
el('skip').onclick=next;el('start').onclick=()=>{if(leader&&ready){player.playVideo();show();}};
el('reveal').onclick=()=>{if(document.body.classList.contains('clean'))show();else document.body.classList.add('clean');};
el('fullscreen').onclick=async()=>{try{const root=document.documentElement;if(document.fullscreenElement)await document.exitFullscreen();else if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else note('此瀏覽器不支援真正全屏');}catch(e){note(e.message);}show();};document.addEventListener('mousemove',show);document.addEventListener('keydown',e=>{show();if(e.key.toLowerCase()==='f'&&!e.repeat&&e.target.tagName!=='TEXTAREA')el('fullscreen').click();});
(async()=>{try{if(!source||!room)throw Error('請由房主手機取得電視連結');const d=await api('/api/player',{});if(d.roomCode!==room)throw Error('房間不符');token=d.roomToken;await ytReady;player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{origin:location.origin,playsinline:1,fs:1,cc_load_policy:1},events:{onReady:()=>{ready=true;heartbeat();},onStateChange:e=>{if(e.data===1){if(!leader){player.pauseVideo();return;}seen=loaded;show();}if(e.data===0&&leader&&current&&seen===current.id){seen=null;next();}},onError:e=>note('YouTube 錯誤 '+e.data+'，可手動下一首'),onAutoplayBlocked:()=>note('請按「開始／繼續」播放')}});}catch(e){note(e.message);}})();
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>

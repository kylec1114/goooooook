<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <title>goooooook TV</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #player { width: 100vw; height: 72vh; }
    #subtitle {
      position: fixed; left: 0; right: 0; bottom: 24vh;
      text-align: center; font-size: 42px; font-weight: 800;
      text-shadow: 0 2px 12px #000; pointer-events: none; padding: 0 5vw;
    }
    #panel { display: flex; gap: 24px; padding: 16px 24px; align-items: flex-start; }
    #now { font-size: 26px; font-weight: 700; }
    #queue { font-size: 18px; opacity: .8; }
    .item { margin: 6px 0; }
    button { background: #e91e63; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="subtitle"></div>
  <div id="panel">
    <div>
      <div id="now">等待第一首歌…</div>
      <button onclick="skip()">跳過呢首</button>
    </div>
    <div id="queue"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const roomCode = (params.get('room') || '').toUpperCase();
    const roomToken = params.get('token') || '';
    let player = null;
    let current = null;
    let lyrics = [];

    const socket = io({ auth: { roomCode, roomToken } });

    socket.on('connect_error', () => {
      document.getElementById('now').textContent = '房間驗證失敗，請由手機重新取得電視連結。';
    });

    socket.on('queueUpdated', queue => {
      const next = queue[0] || null;
      const changed = !current || !next || current.videoId !== next.videoId;
      current = next;
      render(queue);
      if (changed) {
        if (current) {
          document.getElementById('now').innerHTML = `<b>而家唱：</b>${current.title} — ${current.singer}`;
          loadLyrics(current.videoId);
          loadPlayer(current.videoId);
        } else {
          document.getElementById('now').textContent = '等待第一首歌…';
          document.getElementById('subtitle').textContent = '';
          if (player) player.stopVideo();
        }
      }
    });

    function render(queue) {
      document.getElementById('queue').innerHTML = queue.slice(1).map((s, i) =>
        `<div class="item">${i + 1}. ${s.title} — ${s.singer}</div>`
      ).join('');
    }

    function skip() {
      socket.emit('skipSong');
    }

    async function loadLyrics(videoId) {
      lyrics = [];
      document.getElementById('subtitle').textContent = '';
      const res = await fetch(`/api/lyrics/${videoId}`);
      const data = await res.json();
      lyrics = data.lyrics || [];
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        playerVars: { rel: 0, modestbranding: 1 },
        events: {
          onStateChange: event => {
            if (event.data === YT.PlayerState.ENDED) {
              socket.emit('nextSong');
            }
          }
        }
      });
    }

    function loadPlayer(videoId) {
      if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
      }
    }

    setInterval(() => {
      if (!player || !player.getCurrentTime || !lyrics.length) return;
      const time = player.getCurrentTime();
      const line = [...lyrics].reverse().find(l => l.time <= time);
      document.getElementById('subtitle').textContent = line ? line.text : '';
    }, 100);
  </script>
</body>
</html>

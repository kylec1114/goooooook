<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>goooooook TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:18px system-ui}#stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}#player,#stage iframe{display:block;width:100%;height:100%;border:0}#panel{position:fixed;z-index:2;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.92));transition:opacity .25s}body.hide-controls #panel{opacity:0;pointer-events:none}button{font:inherit;padding:12px;margin:5px;border:1px solid #777;border-radius:10px;background:#222;color:#fff;cursor:pointer}button:focus-visible{outline:3px solid #ff4081}#list{white-space:pre-wrap;font-size:14px;max-height:15vh;overflow:auto}#reveal{position:fixed;z-index:3;top:8px;right:8px;opacity:.65}#status{color:#ffd38c;margin:4px 0}
</style></head><body>
<div id="stage"><div id="player"></div></div><button id="reveal" aria-label="顯示或隱藏控制列">控制</button>
<div id="panel"><div id="now">正在驗證電視…</div><p id="status" role="status"></p><button id="start">開始／繼續</button><button id="skip">下一首</button><button id="fullscreen">全螢幕</button><div id="list"></div></div>
<script>
'use strict';
const el=id=>document.getElementById(id);let player,ready=false,current=null,loadedId=null,seenPlaying=null,busy=false,timer;
const params=new URLSearchParams(location.search);let token=params.get('token');const room=params.get('room');history.replaceState(null,'',location.pathname);
let resolveYT;const ytReady=new Promise(r=>resolveYT=r);window.onYouTubeIframeAPIReady=()=>resolveYT();
function show(){document.body.classList.remove('hide-controls');clearTimeout(timer);timer=setTimeout(()=>{if(ready&&player.getPlayerState()===1&&!el('panel').contains(document.activeElement))document.body.classList.add('hide-controls');},5000);}
function note(text){el('status').textContent=text;show();}
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'連線失敗');return d;}
function sync(){if(!ready)return;if(!current){if(loadedId!==null)player.stopVideo();loadedId=null;return;}if(loadedId!==current.id){loadedId=current.id;seenPlaying=null;player.loadVideoById(current.videoId);}}
function update(q){current=q[0]||null;el('now').textContent=current?'而家唱：'+current.title+' — '+current.singer:'等待點歌';el('list').textContent=q.slice(1).map((s,i)=>(i+1)+'. '+s.title+' — '+s.singer).join('\n');sync();}
async function poll(){try{const d=await api('/api/queue');update(d.queue||[]);}catch(e){note(e.message);}finally{setTimeout(poll,5000);}}
async function advance(){if(!current||busy)return;busy=true;try{const d=await api('/api/queue/next',{currentItemId:current.id});update(d.queue||[]);}catch(e){note(e.message);}finally{busy=false;}}
async function fullscreen(){try{const root=document.documentElement;if(document.fullscreenElement)await document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen();else if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else note('此瀏覽器不支援網頁全螢幕；播放器已填滿視窗。');}catch(e){note('無法進入全螢幕：'+e.message);}show();}
el('fullscreen').onclick=fullscreen;el('start').onclick=()=>{if(ready){sync();player.playVideo();}show();};el('skip').onclick=advance;el('reveal').onclick=()=>{if(document.body.classList.contains('hide-controls'))show();else document.body.classList.add('hide-controls');};
document.addEventListener('mousemove',show);document.addEventListener('keydown',e=>{show();if(e.key.toLowerCase()==='f'&&!e.repeat)fullscreen();});document.addEventListener('fullscreenchange',()=>{el('fullscreen').textContent=document.fullscreenElement?'退出全螢幕':'全螢幕';show();});
(async()=>{try{if(!token||!room)throw Error('請由房間遙控頁取得新的電視連結');const d=await api('/api/player',{});if(d.roomCode!==room)throw Error('房間不符');token=d.roomToken;await ytReady;player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{origin:location.origin,playsinline:1,fs:1},events:{onReady:()=>{ready=true;poll();show();},onStateChange:e=>{if(e.data===1){seenPlaying=loadedId;show();}if(e.data===0&&current&&seenPlaying===current.id){seenPlaying=null;advance();}},onError:e=>note('YouTube 播放錯誤 '+e.data+'，可按下一首'),onAutoplayBlocked:()=>note('請按「開始／繼續」播放')}});}catch(e){note(e.message);}})();
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>

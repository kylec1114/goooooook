<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goooooook TV</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b0710;color:#fff;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:#150d20;border-bottom:1px solid #2c1f3a}
    h1{margin:0;font-size:22px}
    .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#d82870}
    main{padding:24px}
    .player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .panel{margin-top:20px;background:#150d20;border:1px solid #2c1f3a;border-radius:16px;padding:20px}
    h2{margin:0 0 12px;font-size:18px}
    label{display:block;margin:14px 0 6px;color:#d7c7e6}
    input[type=range]{width:100%}
    .hint{margin-top:14px;color:#b8a9c9;line-height:1.55}
    .warning{margin-top:14px;padding:12px;border-radius:12px;background:#3a2233;color:#ffd7e6}
    .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    button{padding:12px 18px;border:0;border-radius:12px;background:#d82870;color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#3b2b4d}
  </style>
</head>
<body>
  <header>
    <h1>goooooook TV</h1>
    <span class="badge">伴奏模式</span>
  </header>

  <main>
    <div class="player">
      <iframe id="youtube" src="https://www.youtube.com/embed/videoseries?list=PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI" title="goooooook TV player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <section class="panel">
      <h2>電視音量</h2>
      <label for="tvVolume">整體音量衰減</label>
      <input id="tvVolume" type="range" min="0" max="100" value="100">

      <div class="warning">
        <strong>即時人聲減弱需要 Chrome 擴充功能。</strong><br>
        喺電腦版 Chrome 安裝 <code>goooooook Live Vocal Reduction</code> 擴充功能，
        打開 YouTube 分頁後按擴充功能圖示，再揀「啟動即時人聲減弱」。
      </div>

      <div class="hint">
        呢個模式用中置聲道抵消做實驗性人聲減弱。佢可能會同時減弱部分中置樂器，
        唔保證完全消除人聲；建議配合 YouTube 原生 CC 字幕使用。
      </div>

      <div class="buttons">
        <button id="enableCaptions">顯示 YouTube CC</button>
        <button id="reloadPlayer" class="secondary">重新載入播放器</button>
      </div>
    </section>
  </main>

  <script>
    const youtube = document.getElementById('youtube');
    const tvVolume = document.getElementById('tvVolume');

    document.getElementById('reloadPlayer').onclick = () => {
      const src = youtube.src;
      youtube.src = '';
      setTimeout(() => { youtube.src = src; }, 50);
    };

    document.getElementById('enableCaptions').onclick = () => {
      try {
        youtube.contentWindow.postMessage(
          JSON.stringify({ event: 'command', func: 'setOption', args: ['captions', 'track', ''] }),
          '*'
        );
      } catch (error) {
        console.warn('Unable to control captions:', error);
      }
    };

    tvVolume.addEventListener('input', () => {
      const value = Number(tvVolume.value) / 100;
      localStorage.setItem('goooooook_tv_volume', String(value));
    });

    const savedVolume = localStorage.getItem('goooooook_tv_volume');
    if (savedVolume !== null) {
      tvVolume.value = Math.round(Number(savedVolume) * 100);
    }
  </script>
</body>
</html>

<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>goooooook 版本與狀態</title><link rel="stylesheet" href="/karaoke.css"></head><body><main><h1>版本與狀態</h1><p>顯示目前回應此請求的 Worker；資料庫可讀不代表播放已驗收。</p><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere" role="status">讀取中…</pre><button id="refresh">重新檢查</button><p><a href="/">返回首頁</a></p></main><script>async function check(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('狀態服務 '+r.status);const d=await r.json();document.getElementById('result').textContent=JSON.stringify(d,null,2);}catch(e){document.getElementById('result').textContent=e.message;}}document.getElementById('refresh').onclick=check;check();</script></body></html>

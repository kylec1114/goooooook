<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>goooooook</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0817;color:#fff;font:16px system-ui;max-width:760px;margin:auto;padding-bottom:96px}section{padding:18px;margin:14px;background:linear-gradient(145deg,#241733,#1a1128);border:1px solid #4b335d;border-radius:22px}h1{margin:18px 14px 6px;font-size:30px}h2{margin:0 0 12px;font-size:19px}.sub{margin:0 14px 18px;color:#b8a9c9}input,button,textarea,select,.link{display:block;width:100%;font:inherit;padding:15px;margin:9px 0;border-radius:15px}button,.link{background:linear-gradient(135deg,#ff4b86,#d82870);color:#fff;border:0;cursor:pointer;text-align:center;font-weight:800}button:disabled{opacity:.45}input,textarea,select{border:1px solid #6b4f80;background:#fff;color:#111}small{display:block;color:#b9abc9;line-height:1.5}#roomBanner{position:sticky;top:0;z-index:6;background:#2b1b40;border:2px solid #ff4b86}#roomNumber{display:block;font-size:clamp(36px,10vw,56px);letter-spacing:.14em;overflow-wrap:anywhere}.row{display:flex;gap:9px}.row>*{flex:1}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{width:auto;padding:10px 15px;border-radius:999px;background:#38254c}.chip.active{background:#ff4b86}.now,.next{padding:16px;border-radius:18px;margin:12px 0}.now{background:#40132f;border:1px solid #ff4b86}.next{background:#312044}.label{font-size:11px;color:#ffb3ce;font-weight:800}.title{font-size:23px;font-weight:850;margin:7px 0}.meta{color:#c9b8d8}.badge{color:#ffb3ce}.big{min-height:62px;font-size:19px}.item{padding:14px;border:1px solid #59406d;border-radius:16px;margin:10px 0;background:#221534}.queue-empty{padding:22px;text-align:center;color:#c9b8d8}#status{margin:8px 14px;white-space:pre-wrap;color:#ffd49b}[hidden]{display:none!important}.tabs{position:fixed;left:10px;right:10px;bottom:10px;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px;background:#1c112a;border:1px solid #59406d;border-radius:20px}.tabs button{margin:0;min-height:56px;background:#38254c;font-size:12px}</style></head><body>
<h1>goooooook</h1><p class="sub">私人家庭 KTV · 收藏保存在此裝置</p>
<section id="roomBanner" hidden><span class="label">目前房間碼</span><strong id="roomNumber"></strong><div class="row"><button id="copyRoom">複製房號</button><button id="logout">退出此裝置</button></div></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="access"><h2>進入 KTV 房</h2><label>房間碼<input id="room" maxlength="7" autocomplete="off"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label><button id="login" class="big">進入房間</button><details><summary>建立新房間</summary><label>房間名<input id="name"></label><label>新密碼（至少六字元）<input id="newPassword" type="password" autocomplete="new-password"></label><button id="create">建立並進入房間</button></details></section>
<section id="playingSection"><div class="now"><span class="label">正在唱</span><p class="title" id="nowTitle">等待點歌</p><p class="meta" id="nowMeta"></p><span class="badge" id="nowBadge">待機</span></div><div class="next"><span class="label">下一首</span><p class="title" id="nextTitle">—</p><p class="meta" id="nextMeta"></p></div></section>
<section id="songSection"><h2>點歌</h2><label>YouTube 網址<input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label>歌名<input id="title" maxlength="200"></label><label>歌手<input id="artist" maxlength="120"></label><label>分類<input id="category" maxlength="80"></label><div class="chips"><button class="chip" data-category="粵語">粵語</button><button class="chip" data-category="國語">國語</button><button class="chip" data-category="英文">英文</button><button class="chip" data-category="合唱">合唱</button><button class="chip" data-category="流行">流行</button><button class="chip" data-category="經典">經典</button><button class="chip" data-category="兒歌">兒歌</button></div><label>版本標記<select id="audioMode"><option value="karaoke">伴奏版</option><option value="original">原聲版</option></select></label><small>標記不會消除人聲，請貼上實際伴奏影片網址。</small><label>點歌人<input id="singer" value="Guest" maxlength="80"></label><button id="directQueue" class="big">🎤 直接點歌</button><button id="saveSong">儲存到本機收藏</button><small>只儲存在此裝置；不下載影片或音訊。請定期匯出備份。</small></section>
<section id="lyricsSection"><h2>歌詞字幕</h2><label>歌詞／LRC<textarea id="lyrics" rows="6" maxlength="20000"></textarea></label><small>歌詞保存在本機收藏；目前未接通跨裝置字幕傳送。</small></section>
<section id="librarySection"><h2>我的收藏</h2><label>搜尋收藏<input id="query"></label><p id="libraryStatus"></p><div id="results"></div><div class="row"><button id="exportLibrary">匯出備份</button><button id="migrate">轉存舊雲端歌庫</button></div><label>匯入 JSON 備份<input id="importLibrary" type="file" accept="application/json,.json"></label><small>轉存只複製，不刪雲端原檔。</small></section>
<section id="searchSection"><h2>搵伴奏</h2><input id="youtubeQuery" aria-label="歌名或歌手" placeholder="輸入歌名或歌手"><div class="chips"><button class="chip active" data-search="karaoke">伴奏</button><button class="chip" data-search="instrumental">純音樂</button><button class="chip" data-search="off vocal">無人聲版</button></div><button id="search" class="big">🔍 搜尋伴奏版本</button><small>搜尋現有伴奏版本，並非自動消人聲。</small></section>
<main id="controls" hidden><section id="queueSection"><h2>房間隊列</h2><button id="refresh">重新載入隊列</button><div id="queue"></div></section><section id="tvSection"><h2>電視</h2><a id="tv" class="link big" target="_blank" rel="noopener noreferrer">開啟電視</a><textarea id="tvUrl" readonly aria-label="電視連結"></textarea><small>連結含房間憑證，勿公開。</small></section></main>
<nav class="tabs" aria-label="主要功能"><button data-tab="queue">隊列</button><button data-tab="tv">電視</button><button data-tab="library">收藏</button><button data-tab="search">伴奏</button></nav>
<script>
'use strict';
const el=id=>document.getElementById(id),KEY='goooooook.local-library.v1';
let songs=[],roomCode='',roomToken='',timer=null,generation=0,storageReady=false,searchMode='karaoke';
function status(t){el('status').textContent=t;}
function video(value){try{const u=new URL(value);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||u.port)return null;let id;if(u.hostname==='youtu.be')id=u.pathname.slice(1);else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname))id=u.pathname==='/watch'?u.searchParams.get('v'):/^\/(?:shorts|embed|live)\/([\w-]{11})\/?$/.exec(u.pathname)?.[1];return /^[\w-]{11}$/.test(id||'')?id:null;}catch{return null;}}
function normalise(s){if(!s||typeof s!=='object')throw Error('歌曲格式不正確');const id=video(s.youtube_url||s.youtubeUrl||'');if(!id)throw Error('無效 YouTube 網址');return {id,title:String(s.title||'YouTube 歌曲').slice(0,200),artist:String(s.artist||'').slice(0,120),category:String(s.category||'').slice(0,80),audioMode:s.audioMode==='karaoke'?'karaoke':'original',lyrics:String(s.lyrics||'').slice(0,20000),youtube_url:'https://www.youtube.com/watch?v='+id};}
function saveLibrary(next){if(!storageReady)throw Error('本機儲存未能讀取，已停止寫入以保護資料');localStorage.setItem(KEY,JSON.stringify(next));songs=next;renderLibrary();}
function mergeLibrary(items){const map=new Map(songs.map(s=>[s.id,s]));for(const item of items){const s=normalise(item);map.set(s.id,s);}if(map.size>5000)throw Error('收藏上限5000首');saveLibrary([...map.values()]);}
function action(id,fn){el(id).onclick=async()=>{el(id).disabled=true;try{await fn();}catch(e){status(e.message);}finally{el(id).disabled=false;}};}
function leave(){generation++;clearTimeout(timer);roomToken='';roomCode='';el('roomBanner').hidden=true;el('controls').hidden=true;el('access').hidden=false;el('queue').replaceChildren();el('tv').removeAttribute('href');el('tvUrl').value='';el('roomNumber').textContent='';el('nowTitle').textContent='等待點歌';el('nowMeta').textContent='';el('nowBadge').textContent='待機';el('nextTitle').textContent='—';el('nextMeta').textContent='';try{localStorage.removeItem('goooooook');}catch{}}
async function api(path,body,method){const credential=roomToken;const r=await fetch(path,{method:method||(body===undefined?'GET':'POST'),headers:{Authorization:'Bearer '+credential,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});let d;try{d=await r.json();}catch{throw Error('伺服器未回傳 JSON');}if(!r.ok){if((r.status===401||r.status===410)&&credential&&roomToken===credential){leave();renderLibrary();throw Error('房間或登入已失效，請重新登入；本機收藏仍保留');}throw Error(d.error||'請求失敗');}return d;}
async function enqueue(s){if(!roomToken)throw Error('請先建立或登入房間');const d=await api('/api/queue',{youtubeUrl:s.youtube_url,title:s.title,singer:el('singer').value.trim()||'Guest'});renderQueue(d.queue||[]);status('已加入房間隊列');}
function renderLibrary(){const q=el('query').value.trim().toLowerCase(),matches=songs.filter(s=>[s.title,s.artist,s.category].join(' ').toLowerCase().includes(q));el('libraryStatus').textContent='本機收藏 '+songs.length+' 首；符合 '+matches.length+' 首（最多顯示100首）';el('results').replaceChildren();for(const s of matches.slice(0,100)){const row=document.createElement('div');row.className='item';const label=document.createElement('p');label.textContent=s.title+' — '+s.artist;const add=document.createElement('button');add.textContent='加入隊列';add.disabled=!roomToken;add.onclick=async()=>{add.disabled=true;try{await enqueue(s);}catch(e){status(e.message);}finally{add.disabled=!roomToken;}};const remove=document.createElement('button');remove.textContent='移除本機收藏';remove.onclick=()=>{if(!confirm('移除本機收藏「'+s.title+'」？'))return;try{saveLibrary(songs.filter(x=>x.id!==s.id));}catch(e){status(e.message);}};row.append(label,add,remove);el('results').append(row);}}
function renderQueue(q){el('queue').replaceChildren();const now=q[0],next=q[1];el('nowTitle').textContent=now?now.title:'等待點歌';el('nowMeta').textContent=now?now.singer:'';el('nowBadge').textContent=now?'正在唱':'待機';el('nextTitle').textContent=next?next.title:'—';el('nextMeta').textContent=next?next.singer:'';if(!q.length){const empty=document.createElement('div');empty.className='queue-empty';empty.textContent='暫時未有歌曲，快啲點歌！';el('queue').append(empty);return;}for(const [i,s] of q.entries()){const row=document.createElement('div');row.className='item';const text=document.createElement('p');text.textContent=(i+1)+'. '+s.title+' — '+s.singer;const b=document.createElement('button');b.textContent='移除隊列歌曲';b.onclick=async()=>{b.disabled=true;try{const d=await api('/api/queue/'+encodeURIComponent(s.id),undefined,'DELETE');renderQueue(d.queue||[]);}catch(e){status(e.message);}finally{b.disabled=false;}};row.append(text,b);el('queue').append(row);}}
async function refresh(){const g=generation,d=await api('/api/queue');if(g===generation&&roomToken)renderQueue(d.queue||[]);}
async function poll(g){try{await refresh();}catch(e){status(e.message);}finally{if(g===generation&&roomToken)timer=setTimeout(()=>poll(g),5000);}}
function enter(d){if(!d.roomCode||!d.roomToken)throw Error('登入回應不完整');leave();roomCode=d.roomCode;roomToken=d.roomToken;el('room').value=roomCode;el('roomNumber').textContent=roomCode;el('roomBanner').hidden=false;el('access').hidden=true;el('controls').hidden=false;el('queueSection').hidden=false;el('tvSection').hidden=false;const u=new URL('/tv.html',location.origin);u.searchParams.set('room',roomCode);u.searchParams.set('token',roomToken);el('tv').href=u.href;el('tvUrl').value=u.href;renderLibrary();status('已進入房間 '+roomCode);poll(generation);}
function formSong(){return normalise({youtubeUrl:el('url').value.trim(),title:el('title').value.trim(),artist:el('artist').value.trim(),category:el('category').value.trim(),audioMode:el('audioMode').value,lyrics:el('lyrics').value});}
action('create',async()=>{const d=await api('/api/rooms',{roomName:el('name').value.trim(),password:el('newPassword').value});el('newPassword').value='';enter(d);});
action('login',async()=>{const d=await api('/api/login',{roomCode:el('room').value.trim().toUpperCase(),password:el('password').value});el('password').value='';enter(d);});
action('logout',()=>{leave();renderLibrary();status('已清除此裝置登入狀態；其他裝置未被登出');});
action('copyRoom',async()=>{await navigator.clipboard.writeText(roomCode);status('房號已複製');});
action('saveSong',()=>{mergeLibrary([formSong()]);status('已儲存到本機收藏');});
action('directQueue',()=>enqueue(formSong()));action('refresh',refresh);
action('migrate',async()=>{if(!roomToken)throw Error('請先登入原本房間');const d=await api('/api/songs');if(!Array.isArray(d.songs))throw Error('雲端歌庫格式錯誤');mergeLibrary(d.songs);status('已複製 '+d.songs.length+' 首到本機；雲端資料未刪除');});
action('exportLibrary',()=>{const blob=new Blob([JSON.stringify({version:1,songs},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='goooooook-library.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);});
el('importLibrary').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('備份檔案不可超過5MB');const d=JSON.parse(await file.text()),items=Array.isArray(d)?d:d.songs;if(!Array.isArray(items)||items.length>5000)throw Error('無效歌庫備份');mergeLibrary(items.map(normalise));status('已匯入本機收藏');}catch(error){status(error.message);}finally{e.target.value='';}};
el('query').oninput=renderLibrary;
document.querySelectorAll('[data-category]').forEach(chip=>chip.onclick=()=>{document.querySelectorAll('[data-category]').forEach(x=>x.classList.remove('active'));chip.classList.add('active');el('category').value=chip.dataset.category;});
document.querySelectorAll('[data-search]').forEach(chip=>chip.onclick=()=>{document.querySelectorAll('[data-search]').forEach(x=>x.classList.remove('active'));chip.classList.add('active');searchMode=chip.dataset.search;});
document.querySelectorAll('[data-tab]').forEach(tab=>tab.onclick=()=>{const target=tab.dataset.tab;if((target==='queue'||target==='tv')&&!roomToken){el('access').hidden=false;status('請先建立或登入房間');return;}const visible=target==='queue'?['playingSection','songSection','lyricsSection','queueSection']:target==='tv'?['tvSection']:target==='library'?['songSection','lyricsSection','librarySection']:['songSection','searchSection'];for(const id of ['playingSection','songSection','lyricsSection','queueSection','tvSection','librarySection','searchSection'])el(id).hidden=!visible.includes(id);el('controls').hidden=target!=='queue'&&target!=='tv';el('access').hidden=!!roomToken;});
action('search',()=>{const q=el('youtubeQuery').value.trim();if(!q)throw Error('請輸入歌名或歌手');window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' '+searchMode),'_blank','noopener,noreferrer');});
try{const raw=localStorage.getItem(KEY),items=raw===null?[]:JSON.parse(raw);if(!Array.isArray(items))throw Error('本機歌庫格式錯誤');songs=items.map(normalise);storageReady=true;}catch(e){status('本機歌庫讀取失敗，已停止寫入以保護原資料：'+e.message);}renderLibrary();
const shared=new URLSearchParams(location.search).get('shared');if(shared){el('url').value=shared;history.replaceState(null,'',location.pathname);}
</script></body></html>

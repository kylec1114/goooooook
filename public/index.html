<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e91e63">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>goooooook</title>
<style>
:root{--bg:#0b0b10;--card:#16161f;--card2:#1e1e2a;--line:#2c2c3a;--text:#f4f4f6;--muted:#a7a7b8;--pink:#e91e63;--pink2:#ff4f81;--green:#3ddc84;--amber:#ffb74d;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#221327,var(--bg));color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:820px;margin:auto;padding:18px 16px 110px}header{position:sticky;top:0;z-index:10;background:rgba(11,11,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),#7c4dff);display:grid;place-items:center;color:#fff}.topnav{display:flex;gap:8px}.topnav a{color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px}.topnav a:hover{color:#fff;border-color:var(--pink)}h1{font-size:26px;margin:20px 0 6px}.sub{color:var(--muted);margin:0 0 18px}section{background:linear-gradient(180deg,var(--card),#131320);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 12px 30px rgba(0,0,0,.25)}h2{margin:0 0 12px;font-size:19px}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:14px}input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e0e15;color:#fff;font:inherit}input:focus,textarea:focus{outline:2px solid var(--pink);outline-offset:1px}button,.link{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}.link{display:block;text-align:center;text-decoration:none}.secondary{background:var(--card2);border:1px solid var(--line);color:#fff}.small{color:var(--muted);font-size:13px;display:block;margin-top:8px}#status{min-height:22px;padding:10px 12px;border-radius:10px;background:#101018;border:1px solid var(--line);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:var(--green)!important;border-color:#1f5137!important}.error{color:var(--red)!important;border-color:#5b2430!important}.grid{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}.item strong{display:block}.item span{color:var(--muted);font-size:14px}.queuebox{position:fixed;left:0;right:0;bottom:0;background:rgba(22,22,31,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px;max-height:38vh;overflow:auto}.queuebox h2{font-size:16px;margin-bottom:6px}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#2a2a38;color:var(--muted);font-size:12px}.results{max-height:420px;overflow:auto}[hidden]{display:none!important}@media(min-width:720px){main{padding-bottom:32px}.queuebox{position:static;max-height:none;background:none;border:0;backdrop-filter:none;padding:0}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">♪</div>goooooook</div><nav class="topnav"><a href="/downloads.html">下載</a></nav></header>
<main>
<h1>家庭 KTV 遙控</h1><p class="sub">私人點歌 · 歌庫與隊列保存在 host</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="access">
<h2>進入房間</h2>
<label>房間碼<input id="room" maxlength="7" autocomplete="off" inputmode="text"></label>
<label>密碼<input id="password" type="password" autocomplete="current-password"></label>
<button id="login">進入房間</button>
<details><summary>建立新房間</summary><label>房間名<input id="name" placeholder="例如：屋企 KTV"></label><label>新密碼<input id="newPassword" type="password" autocomplete="new-password"></label><button id="create" class="secondary">建立房間</button></details>
</section>
<div id="controls" hidden>
<section><h2>歌庫</h2><label>搜尋歌名／歌手／分類<input id="query" placeholder="輸入關鍵字"></label><button id="reload" class="secondary">重新載入歌庫</button><p class="small" id="libraryStatus"></p><div id="results" class="results"></div></section>
<section><h2>YouTube</h2><label>歌名或歌手<input id="youtubeQuery" placeholder="例如：陳奕迅 K 歌"></label><button id="search">喺 YouTube 搜尋</button><small>會開 YouTube；揀片後可複製網址，或用 Android 分享直接帶入。</small></section>
<section><h2>貼網址點歌</h2><label>YouTube 網址<input id="url" type="url" placeholder="https://youtu.be/..."></label><label>歌名（選填）<input id="title"></label><label>邊個唱？<input id="singer" value="Guest"></label><button id="add">加入隊列</button></section>
<section><h2>電視連結</h2><a id="tv" class="link" target="_blank" rel="noopener noreferrer">開電視頁</a><textarea id="tvUrl" readonly aria-label="電視網址"></textarea><small>連結包含房間憑證，請勿公開。其他裝置請用 host 的 LAN IP 登入後取得連結。</small></section>
</div>
<div class="queuebox" id="queuePanel"><h2>隊列 <span class="pill" id="queueCount">0</span></h2><div id="queue"></div></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const el=id=>document.getElementById(id);let songs=[],socket=null,libraryReady=false;
function status(text,kind){const s=el('status');s.textContent=text;s.className=kind==='ok'?'ok':kind==='error'?'error':'';}
async function api(url,body){const r=await fetch(url,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let d;try{d=await r.json();}catch{throw Error('Server 回應唔正確');}if(!r.ok)throw Error(d.error||'請求失敗');return d;}
function action(id,fn){el(id).addEventListener('click',async()=>{el(id).disabled=true;try{await fn();}catch(e){status(e.message||'操作失敗','error');}finally{el(id).disabled=false;}});}
function renderQueue(q){el('queueCount').textContent=q.length;const box=el('queue');box.replaceChildren();if(!q.length){box.innerHTML='<p class="small">暫時未有歌曲。貼上 YouTube 網址開始。</p>';return;}q.forEach((s,i)=>{const row=document.createElement('div');row.className='item';const left=document.createElement('div');left.innerHTML='<strong></strong><span></span>';left.querySelector('strong').textContent=(i+1)+'. '+(s.title||'YouTube 歌曲');left.querySelector('span').textContent='主唱：'+(s.singer||'Guest');row.append(left);box.append(row);});}
async function addSong(url,title){const d=await api('/api/queue',{youtubeUrl:url,title:title||'',singer:el('singer').value.trim()||'Guest'});renderQueue(d.queue||[]);status('已加入隊列','ok');}
function renderLibrary(){const box=el('results');box.replaceChildren();if(!libraryReady)return;const q=el('query').value.trim().toLowerCase();const matches=songs.filter(s=>[s.title,s.artist,s.category,s.language].map(v=>String(v||'')).join(' ').toLowerCase().includes(q));el('libraryStatus').textContent='符合 '+matches.length+' 首，顯示最多 100 首';matches.slice(0,100).forEach(song=>{const card=document.createElement('div');card.className='item';const left=document.createElement('div');left.innerHTML='<strong></strong><span></span>';left.querySelector('strong').textContent=song.title||'未命名';left.querySelector('span').textContent=song.artist||'';const b=document.createElement('button');b.textContent='加入';b.disabled=!song.youtube_url;b.style.width='auto';b.style.margin='0';b.addEventListener('click',async()=>{b.disabled=true;try{await addSong(song.youtube_url,song.title);}catch(e){status(e.message,'error');}finally{b.disabled=!song.youtube_url;}});card.append(left,b);box.append(card);});}
async function loadLibrary(){libraryReady=false;el('libraryStatus').textContent='載入歌庫中…';el('results').replaceChildren();try{const d=await api('/api/songs');songs=Array.isArray(d.songs)?d.songs:[];libraryReady=true;renderLibrary();}catch(e){el('libraryStatus').textContent='載入失敗，請按重新載入';throw e;}}
action('create',async()=>{const d=await api('/api/rooms',{roomName:el('name').value.trim(),password:el('newPassword').value});el('room').value=d.roomCode;el('newPassword').value='';status('房間已建立：'+d.roomCode+'。請用剛設定的密碼登入。','ok');});
action('login',async()=>{const d=await api('/api/login',{roomCode:el('room').value.trim().toUpperCase(),password:el('password').value});if(!d.roomCode||!d.roomToken)throw Error('登入回應不兼容');if(socket)socket.disconnect();socket=io({auth:{roomCode:d.roomCode,roomToken:d.roomToken}});socket.on('queueUpdated',renderQueue);socket.on('connect_error',()=>status('即時連線驗證失敗；請重新登入。','error'));socket.on('disconnect',()=>status('即時連線中斷。','error'));const u=new URL('/tv.html',location.origin);u.searchParams.set('room',d.roomCode);u.searchParams.set('token',d.roomToken);el('tv').href=u.href;el('tvUrl').value=u.href;el('password').value='';el('access').hidden=true;el('controls').hidden=false;status('已登入 '+d.roomCode,'ok');const q=await api('/api/queue');renderQueue(q.queue||[]);await loadLibrary();});
action('reload',loadLibrary);action('add',async()=>{await addSong(el('url').value.trim(),el('title').value.trim());el('url').value='';});
el('query').addEventListener('input',renderLibrary);
el('search').addEventListener('click',()=>{const q=el('youtubeQuery').value.trim();if(!q){status('請輸入歌名或歌手','error');return;}window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' karaoke'),'_blank','noopener,noreferrer');});
(function(){const shared=new URLSearchParams(location.search).get('shared');if(!shared)return;el('url').value=shared;history.replaceState(null,'',location.pathname);status('已從 Android 分享帶入網址；登入後按「加入隊列」。','ok');})();
</script>
</body></html>

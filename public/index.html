<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>goooooook</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#100b19;color:#fff;font:16px system-ui;max-width:800px;margin:auto}section{padding:18px;margin:16px 0;background:#21172e;border-radius:16px}input,button,textarea,.link{display:block;width:100%;font:inherit;padding:12px;margin:8px 0;border-radius:10px}button,.link{background:#d82870;color:#fff;border:0;cursor:pointer;text-align:center}button:disabled{opacity:.5}input,textarea{border:1px solid #777;background:#fff;color:#111}small{display:block;color:#bfb2cc}#roomBanner{position:sticky;top:0;z-index:4;background:#291b3d;border:2px solid #ed4b94}#roomNumber{font-size:clamp(32px,8vw,52px);letter-spacing:.12em;display:block;overflow-wrap:anywhere}.item{padding:12px;border:1px solid #685075;border-radius:10px;margin:10px 0}#status{white-space:pre-wrap;color:#ffd49b}[hidden]{display:none!important}</style></head><body>
<h1>goooooook</h1><p>私人家庭點歌 · 收藏保存在此裝置</p>
<section id="roomBanner" hidden><small>目前房間碼</small><strong id="roomNumber"></strong><button id="copyRoom">複製房號</button><button id="logout">退出此裝置</button></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="access"><h2>登入房間</h2><label>房間碼<input id="room" maxlength="7" autocomplete="off"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label><button id="login">進入房間</button><details><summary>建立房間</summary><label>房間名<input id="name"></label><label>新密碼（至少六字元）<input id="newPassword" type="password" autocomplete="new-password"></label><button id="create">建立並進入房間</button></details></section>
<section><h2>本機收藏歌庫</h2><small>只儲存在此瀏覽器／App；不下載影片或音訊。清除資料或換機可能遺失收藏，請匯出備份。</small><label>YouTube 網址<input id="url" type="url"></label><label>歌名<input id="title" maxlength="200"></label><label>歌手<input id="artist" maxlength="120"></label><label>分類<input id="category" maxlength="80"></label><button id="saveSong">儲存到本機收藏</button><button id="directQueue">直接點歌（需要登入）</button><label>點歌人<input id="singer" value="Guest" maxlength="80"></label><label>搜尋收藏<input id="query"></label><p id="libraryStatus"></p><div id="results"></div><button id="exportLibrary">匯出 JSON 備份</button><label>匯入 JSON 備份<input id="importLibrary" type="file" accept="application/json,.json"></label><button id="migrate">將目前房間舊雲端歌庫複製到本機</button><small>轉存只複製、不刪雲端原檔；失敗時會顯示錯誤。</small></section>
<section><h2>YouTube 搜尋</h2><input id="youtubeQuery" aria-label="歌名或歌手"><button id="search">開 YouTube 搜尋伴奏</button></section>
<main id="controls" hidden><section><h2>房間隊列</h2><button id="refresh">重新載入隊列</button><div id="queue"></div></section><section><h2>電視連結</h2><a id="tv" class="link" target="_blank" rel="noopener noreferrer">開啟電視</a><textarea id="tvUrl" readonly aria-label="電視連結"></textarea><small>連結含房間憑證，勿公開。退出此裝置不會撤銷其他裝置憑證。</small></section></main>
<script>
'use strict';
const el=id=>document.getElementById(id),KEY='goooooook.local-library.v1';
let songs=[],roomCode='',roomToken='',timer=null,generation=0,storageReady=false;
function status(t){el('status').textContent=t;}
function video(value){try{const u=new URL(value);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||u.port)return null;let id;if(u.hostname==='youtu.be')id=u.pathname.slice(1);else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname))id=u.pathname==='/watch'?u.searchParams.get('v'):/^\/(?:shorts|embed|live)\/([\w-]{11})\/?$/.exec(u.pathname)?.[1];return /^[\w-]{11}$/.test(id||'')?id:null;}catch{return null;}}
function normalise(s){if(!s||typeof s!=='object')throw Error('歌曲格式不正確');const id=video(s.youtube_url||s.youtubeUrl||'');if(!id)throw Error('無效 YouTube 網址');return {id,title:String(s.title||'YouTube 歌曲').slice(0,200),artist:String(s.artist||'').slice(0,120),category:String(s.category||'').slice(0,80),youtube_url:'https://www.youtube.com/watch?v='+id};}
function saveLibrary(next){if(!storageReady)throw Error('本機儲存未能讀取，為避免覆蓋資料已停止儲存；請先檢查瀏覽器儲存設定');localStorage.setItem(KEY,JSON.stringify(next));songs=next;renderLibrary();}
function mergeLibrary(items){const map=new Map(songs.map(s=>[s.id,s]));for(const item of items){const s=normalise(item);map.set(s.id,s);}if(map.size>5000)throw Error('本機收藏上限為5000首，請分開備份');saveLibrary([...map.values()]);}
function action(id,fn){el(id).onclick=async()=>{el(id).disabled=true;try{await fn();}catch(e){status(e.message);}finally{el(id).disabled=false;}};}
function leave(){generation++;clearTimeout(timer);roomToken='';roomCode='';el('roomBanner').hidden=true;el('controls').hidden=true;el('access').hidden=false;el('queue').replaceChildren();el('tv').removeAttribute('href');el('tvUrl').value='';el('roomNumber').textContent='';try{localStorage.removeItem('goooooook');}catch{}}
async function api(path,body,method){const credential=roomToken;const r=await fetch(path,{method:method||(body===undefined?'GET':'POST'),headers:{Authorization:'Bearer '+credential,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});let d;try{d=await r.json();}catch{throw Error('伺服器未回傳 JSON，請確認網站部署');}if(!r.ok){if((r.status===401||r.status===410)&&credential&&roomToken===credential){leave();throw Error('房間或登入已失效，請重新登入；本機收藏仍保留');}throw Error(d.error||'請求失敗');}return d;}
async function enqueue(s){if(!roomToken)throw Error('請先建立或登入房間');const d=await api('/api/queue',{youtubeUrl:s.youtube_url,title:s.title,singer:el('singer').value.trim()||'Guest'});renderQueue(d.queue||[]);status('已加入房間隊列');}
function renderLibrary(){const q=el('query').value.trim().toLowerCase(),matches=songs.filter(s=>[s.title,s.artist,s.category].join(' ').toLowerCase().includes(q));el('libraryStatus').textContent='本機收藏 '+songs.length+' 首；符合 '+matches.length+' 首（最多顯示100首）';el('results').replaceChildren();for(const s of matches.slice(0,100)){const row=document.createElement('div');row.className='item';const label=document.createElement('p');label.textContent=s.title+' — '+s.artist;const add=document.createElement('button');add.textContent='加入隊列';add.disabled=!roomToken;add.onclick=async()=>{add.disabled=true;try{await enqueue(s);}catch(e){status(e.message);}finally{add.disabled=!roomToken;}};const remove=document.createElement('button');remove.textContent='移除本機收藏';remove.onclick=()=>{if(!confirm('移除本機收藏「'+s.title+'」？'))return;try{saveLibrary(songs.filter(x=>x.id!==s.id));}catch(e){status(e.message);}};row.append(label,add,remove);el('results').append(row);}}
function renderQueue(q){el('queue').replaceChildren();if(!q.length)el('queue').textContent='暫時未有歌曲';for(const [i,s] of q.entries()){const row=document.createElement('div');row.className='item';const text=document.createElement('p');text.textContent=(i+1)+'. '+s.title+' — '+s.singer;const b=document.createElement('button');b.textContent='移除隊列歌曲';b.onclick=async()=>{b.disabled=true;try{const d=await api('/api/queue/'+encodeURIComponent(s.id),undefined,'DELETE');renderQueue(d.queue||[]);}catch(e){status(e.message);}finally{b.disabled=false;}};row.append(text,b);el('queue').append(row);}}
async function refresh(){const g=generation,d=await api('/api/queue');if(g===generation&&roomToken)renderQueue(d.queue||[]);}
async function poll(g){try{await refresh();}catch(e){status(e.message);}finally{if(g===generation&&roomToken)timer=setTimeout(()=>poll(g),5000);}}
function enter(d){if(!d.roomCode||!d.roomToken)throw Error('登入回應不完整');leave();roomCode=d.roomCode;roomToken=d.roomToken;el('room').value=roomCode;el('roomNumber').textContent=roomCode;el('roomBanner').hidden=false;el('access').hidden=true;el('controls').hidden=false;const u=new URL('/tv.html',location.origin);u.searchParams.set('room',roomCode);u.searchParams.set('token',roomToken);el('tv').href=u.href;el('tvUrl').value=u.href;renderLibrary();status('已進入房間 '+roomCode+'；舊雲端歌庫可按轉存按鈕保存到本機');poll(generation);}
function formSong(){return normalise({youtubeUrl:el('url').value.trim(),title:el('title').value.trim(),artist:el('artist').value.trim(),category:el('category').value.trim()});}
action('create',async()=>{const d=await api('/api/rooms',{roomName:el('name').value.trim(),password:el('newPassword').value});el('newPassword').value='';enter(d);});
action('login',async()=>{const d=await api('/api/login',{roomCode:el('room').value.trim().toUpperCase(),password:el('password').value});el('password').value='';enter(d);});
action('logout',()=>{leave();renderLibrary();status('已清除此裝置登入狀態；其他裝置未被登出');});
action('copyRoom',async()=>{await navigator.clipboard.writeText(roomCode);status('房號已複製');});
action('saveSong',()=>{mergeLibrary([formSong()]);status('已儲存到本機收藏，沒有上傳雲端');});
action('directQueue',()=>enqueue(formSong()));action('refresh',refresh);
action('migrate',async()=>{if(!roomToken)throw Error('請先登入原本房間');const d=await api('/api/songs');if(!Array.isArray(d.songs))throw Error('雲端歌庫格式錯誤');mergeLibrary(d.songs);status('已複製 '+d.songs.length+' 首到本機；雲端資料未刪除，建議立即匯出備份');});
action('exportLibrary',()=>{const blob=new Blob([JSON.stringify({version:1,songs},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='goooooook-library.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);});
el('importLibrary').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('備份檔案不可超過5MB');const d=JSON.parse(await file.text()),items=Array.isArray(d)?d:d.songs;if(!Array.isArray(items)||items.length>5000)throw Error('無效歌庫備份');const validated=items.map(normalise);mergeLibrary(validated);status('已匯入本機收藏；相同影片會合併');}catch(error){status(error.message);}finally{e.target.value='';}};
el('query').oninput=renderLibrary;action('search',()=>{const q=el('youtubeQuery').value.trim();if(!q)throw Error('請輸入歌名或歌手');window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' karaoke'),'_blank','noopener,noreferrer');});
try{const raw=localStorage.getItem(KEY);const items=raw===null?[]:JSON.parse(raw);if(!Array.isArray(items))throw Error('本機歌庫格式錯誤');songs=items.map(normalise);storageReady=true;localStorage.removeItem('goooooook');}catch(e){status('本機歌庫讀取失敗，已停止寫入以保護原資料：'+e.message);}renderLibrary();
const shared=new URLSearchParams(location.search).get('shared');if(shared){el('url').value=shared;history.replaceState(null,'',location.pathname);}
</script></body></html>

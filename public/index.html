<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>goooooook</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0f0f13;color:#eee;font:16px system-ui;max-width:760px;margin:auto}section{background:#191922;padding:18px;border-radius:14px;margin:16px 0}input,button,a.link{font:inherit;padding:12px;border-radius:8px;margin:6px 0;width:100%}input{background:#fff;color:#111;border:1px solid #777}button,a.link{background:#e91e63;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}a.link{display:block;text-align:center;overflow-wrap:anywhere}small{display:block;color:#aaa}.item{padding:12px;margin:8px 0;background:#252532;border-radius:8px}#status{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;min-height:100px}[hidden]{display:none!important}
</style>
</head>
<body>
<h1>goooooook</h1><p>私人家庭點歌 · 唔使 Excel · 資料存雲端</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="access">
<h2>登入房間</h2><label>房間碼<input id="room" maxlength="7" autocomplete="off"></label>
<label>密碼<input id="password" type="password" autocomplete="current-password"></label>
<button id="login">進入房間</button>
<details><summary>建立房間</summary><label>房間名<input id="name"></label><label>新密碼<input id="newPassword" type="password" autocomplete="new-password"></label><button id="create">建立新房間</button></details>
</section>
<main id="controls" hidden>
<section><h2>新增歌曲</h2><label>YouTube 網址<input id="url" type="url"></label><label>歌名<input id="title"></label><label>歌手<input id="artist"></label><label>分類／語言（選填）<input id="category"></label><button id="addSong">加入歌庫</button></section>
<section><h2>歌庫搜尋</h2><label>歌名／歌手／分類<input id="query"></label><button id="reload">重新載入歌庫</button><p id="libraryStatus"></p><div id="results"></div></section>
<section><h2>YouTube 搜尋捷徑</h2><label>歌名或歌手<input id="youtubeQuery"></label><button id="search">喺 YouTube 搜尋</button><small>會開 YouTube；揀片後複製網址，再貼入上面新增歌曲。</small></section>
<section><h2>隊列</h2><div id="queue"></div></section>
<section><h2>電視連結</h2><a id="tv" class="link" target="_blank" rel="noopener noreferrer">開電視頁</a><textarea id="tvUrl" readonly aria-label="電視網址"></textarea><small>呢條連結包含房間憑證，請勿公開。</small></section>
</main>
<script>
'use strict';
const el=id=>document.getElementById(id);
let songs=[],queue=[],roomCode='',roomToken='',libraryReady=false;
function status(text){el('status').textContent=text;}
async function api(url,body){const response=await fetch(url,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+roomToken,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});let data;try{data=await response.json();}catch{throw new Error('伺服器回應錯誤');}if(!response.ok)throw new Error(data.error||'請求失敗');return data;}
function action(id,fn){el(id).addEventListener('click',async()=>{el(id).disabled=true;try{await fn();}catch(error){status(error.message||'操作失敗');}finally{el(id).disabled=false;}});}
function renderQueue(){const box=el('queue');box.replaceChildren();if(!queue.length){box.textContent='暫時未有歌曲';return;}queue.forEach((song,i)=>{const row=document.createElement('div');row.className='item';const label=document.createElement('p');label.textContent=(i+1)+'. '+String(song.title||'YouTube 歌曲')+' — '+String(song.singer||'Guest');const button=document.createElement('button');button.textContent='移除';button.addEventListener('click',async()=>{button.disabled=true;try{const d=await api('/api/queue/'+song.id,{currentItemId:song.id});queue=d.queue||[];renderQueue();}catch(e){status(e.message);}finally{button.disabled=false;}});row.append(label,button);box.append(row);});}
function renderLibrary(){const box=el('results');box.replaceChildren();if(!libraryReady)return;const q=el('query').value.trim().toLowerCase();const matches=songs.filter(s=>[s.title,s.artist,s.category,s.language].map(v=>String(v||'')).join(' ').toLowerCase().includes(q));el('libraryStatus').textContent='符合 '+matches.length+' 首，顯示最多 100 首';matches.slice(0,100).forEach(song=>{const card=document.createElement('div');card.className='item';const label=document.createElement('p');label.textContent=String(song.title||'未命名')+' — '+String(song.artist||'');const button=document.createElement('button');button.textContent='加入隊列';button.addEventListener('click',async()=>{button.disabled=true;try{const d=await api('/api/queue',{youtubeUrl:song.youtube_url,title:song.title,singer:'Guest'});queue=d.queue||[];renderQueue();status('已加入隊列');}catch(e){status(e.message);}finally{button.disabled=false;}});card.append(label,button);box.append(card);});}
async function loadLibrary(){libraryReady=false;el('libraryStatus').textContent='載入歌庫中…';el('results').replaceChildren();try{const data=await api('/api/songs');songs=Array.isArray(data.songs)?data.songs:[];libraryReady=true;renderLibrary();}catch(error){el('libraryStatus').textContent='載入失敗，請按重新載入';throw error;}}
async function loadQueue(){try{const data=await api('/api/queue');queue=data.queue||[];renderQueue();}catch{}}
action('create',async()=>{const data=await api('/api/rooms',{roomName:el('name').value.trim(),password:el('newPassword').value});roomCode=data.roomCode;roomToken=data.roomToken;localStorage.setItem('goooooook',JSON.stringify({roomCode,roomToken}));el('room').value=roomCode;el('newPassword').value='';status('房間已建立：'+roomCode+'。請用剛設定的密碼登入。');});
action('login',async()=>{const data=await api('/api/login',{roomCode:el('room').value.trim().toUpperCase(),password:el('password').value});roomCode=data.roomCode;roomToken=data.roomToken;localStorage.setItem('goooooook',JSON.stringify({roomCode,roomToken}));el('password').value='';el('access').hidden=true;el('controls').hidden=false;const url=new URL('/tv.html',location.origin);url.searchParams.set('room',roomCode);url.searchParams.set('token',roomToken);el('tv').href=url.href;el('tvUrl').value=url.href;status('已登入 '+roomCode);await loadQueue();await loadLibrary();setInterval(loadQueue,3000);});
action('addSong',async()=>{const data=await api('/api/songs',{youtubeUrl:el('url').value.trim(),title:el('title').value.trim(),artist:el('artist').value.trim(),category:el('category').value.trim()});el('url').value='';el('title').value='';el('artist').value='';el('category').value='';status('已加入歌庫');await loadLibrary();return data;});
action('reload',loadLibrary);
action('search',()=>{const q=el('youtubeQuery').value.trim();if(!q){status('請輸入歌名或歌手');return;}window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' karaoke'),'_blank','noopener,noreferrer');});
el('query').addEventListener('input',renderLibrary);
(async()=>{const saved=JSON.parse(localStorage.getItem('goooooook')||'null');if(saved?.roomCode&&saved?.roomToken){el('room').value=saved.roomCode;}})();
</script>
</body>
</html>
